<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Wikidoogo</title>
    <link rel="stylesheet" href="socialwiki.css?v=999999">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            color: #050505;
        }
        .navbar {
            background: #1877f2;
            padding: 0 16px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar a { color: white; text-decoration: none; font-size: 20px; }
        .logo { font-weight: 800; font-size: 22px; }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #ffd700, #f7b928);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .header h1 { margin: 0 0 5px; font-size: 28px; }
        .header p { margin: 0; opacity: 0.8; }

        /* ========== TABS ========== */
        .type-tabs {
            display: flex;
            gap: 5px;
            background: white;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        .type-tab {
            flex: 1;
            padding: 12px 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            color: #65676b;
            border-radius: 8px;
            white-space: nowrap;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .type-tab:hover { background: #f0f2f5; }
        .type-tab.active {
            background: #1877f2;
            color: white;
        }

        .period-tabs {
            display: flex;
            gap: 5px;
            background: white;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        .period-tab {
            flex: 1;
            padding: 10px 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            color: #65676b;
            border-radius: 8px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .period-tab:hover { background: #f0f2f5; }
        .period-tab.active {
            background: #1877f2;
            color: white;
        }

        /* ========== ITEMS ========== */
        .lb-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .lb-item:hover { transform: translateX(-3px); }

        .lb-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }
        .lb-rank.top-1 { background: linear-gradient(135deg, #ffd700, #f7b928); color: #333; font-size: 20px; }
        .lb-rank.top-2 { background: linear-gradient(135deg, #c0c0c0, #e0e0e0); color: #333; font-size: 20px; }
        .lb-rank.top-3 { background: linear-gradient(135deg, #cd7f32, #e8a559); color: white; font-size: 20px; }
        .lb-rank.other { background: #f0f2f5; color: #65676b; }

        .lb-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e4e6eb;
        }

        .lb-info { flex: 1; min-width: 0; }
        .lb-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lb-username { font-size: 12px; color: #65676b; }

        .lb-views { text-align: center; flex-shrink: 0; }
        .lb-views-value { font-size: 20px; font-weight: 800; color: #1877f2; }
        .lb-views-label { font-size: 18px; }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #65676b;
        }
        .empty-icon { font-size: 60px; margin-bottom: 15px; }
    </style>
</head>
<body>

              <nav class="navbar">
    <div class="nav-left">
        <button id="hamburgerBtn" onclick="toggleMobileSidebar()" class="hamburger-btn">☰</button>
        <a href="index.html" class="logo">
            <img src="images/storyimage.jpeg" alt="Wikidoogo" class="logo-img">
            <span>Wikidoogo</span>
        </a>
    </div>

    <div class="navbar-search">
        <span class="search-icon">🔍</span>
        <input 
            type="text" 
            id="navbarSearchInput"
            data-i18n-placeholder="search_placeholder"
            placeholder="Search Wikidoogo..."
            autocomplete="off"
            oninput="handleSearchInput(this.value)"
            onfocus="handleSearchInput(this.value)">
        <div class="search-results" id="searchResults" style="display: none;"></div>
    </div>

    <ul class="nav-icons">
        <li><a href="index.html" title="Home">🏠</a></li>
        <li><a href="friends.html" title="Friends">👥</a></li>
        <li><a href="market-plus.html" title="Marketplace">🛍️</a></li>
        <li><a href="events.html" title="Events">📅</a></li>
        <li><a href="messenger.html" title="Messages">💬</a></li>
    </ul>

    <div class="nav-right">
        <a href="notifications.html" id="navNotificationBtn" class="notification-btn" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); text-decoration: none; color: white; font-size: 20px;">
            🔔
            <span class="notification-badge" id="navNotificationBadge" style="display: none;">0</span>
        </a>
        <a href="earnings.html" id="navPointsBtn" class="notification-btn" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); text-decoration: none; color: white; font-size: 20px;">
            💰
            <span class="notification-badge" id="navPointsBadge" style="display: none; background: #ffd700; color: #333;">0</span>
        </a>
        <a href="profile.html" class="nav-profile">
            <img src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" id="navProfileImg" alt="Profile">
            <span id="navProfileName">User</span>
        </a>
        <div class="language-selector">
            <button class="language-btn" onclick="toggleLanguageMenu()">🌐</button>
            <div class="language-menu" id="languageMenu" style="max-height: 400px; overflow-y: auto;">
                <button onclick="changeLanguage('ar')">🇲🇦 العربية</button>
                <button onclick="changeLanguage('fr')">🇫🇷 Français</button>
                <button onclick="changeLanguage('en')">🇬🇧 English</button>
                <button onclick="changeLanguage('es')">🇪🇸 Español</button>
                <button onclick="changeLanguage('de')">🇩🇪 Deutsch</button>
                <button onclick="changeLanguage('it')">🇮🇹 Italiano</button>
                <button onclick="changeLanguage('ja')">🇯🇵 日本語</button>
                <button onclick="changeLanguage('zh')">🇨🇳 中文</button>
                <button onclick="changeLanguage('ko')">🇰🇷 한국어</button>
                <button onclick="changeLanguage('ru')">🇷🇺 Русский</button>
                <button onclick="changeLanguage('tr')">🇹🇷 Türkçe</button>
                <button onclick="changeLanguage('hi')">🇮🇳 हिन्दी</button>
                <button onclick="changeLanguage('fil')">🇵🇭 Filipino</button>
                <button onclick="changeLanguage('tl')">🇵🇭 Tagalog</button>
                <button onclick="changeLanguage('am')">🇪🇹 አማርኛ</button>
            </div>
        </div>
        <button class="logout-button" onclick="logout()" data-i18n="logout">Logout</button>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>🏆 قائمة المتصدرين</h1>
        <p>أكثر المستخدمين نشاطاً على Wikidoogo</p>
    </div>

    <!-- Type Tabs -->
    <div class="type-tabs">
        <button class="type-tab active" onclick="loadLB('views', null, this)">
            <span>👁️</span> <span data-i18n="leaderboard_views">المشاهدات</span>
        </button>
        <button class="type-tab" onclick="loadLB('posts', null, this)">
            <span>📝</span> <span data-i18n="leaderboard_posts">المنشورات</span>
        </button>
        <button class="type-tab" onclick="loadLB('likes', null, this)">
            <span>👍</span> <span data-i18n="leaderboard_likes">الإعجابات</span>
        </button>
        <button class="type-tab" onclick="loadLB('comments', null, this)">
            <span>💬</span> <span data-i18n="leaderboard_comments">التعليقات</span>
        </button>
    </div>

    <!-- Period Tabs -->
    <div class="period-tabs">
        <button class="period-tab active" onclick="loadLB(null, 'today', this)" data-i18n="leaderboard_today">اليوم</button>
        <button class="period-tab" onclick="loadLB(null, 'week', this)" data-i18n="leaderboard_week">الأسبوع</button>
        <button class="period-tab" onclick="loadLB(null, 'month', this)" data-i18n="leaderboard_month">الشهر</button>
        <button class="period-tab" onclick="loadLB(null, 'all', this)" data-i18n="leaderboard_all">الكل</button>
    </div>

    <div id="leaderboard">
        <div class="empty">
            <div class="empty-icon">⏳</div>
            <p data-i18n="leaderboard_loading">جاري التحميل...</p>
        </div>
    </div>

    <!-- Share Button -->
    <div style="margin: 30px 0 20px;">
        <button onclick="shareLeaderboard()" style="
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1877f2, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4);
        ">
            📤 <span data-i18n="share_leaderboard">شارك قائمة المتصدرين</span>
        </button>
    </div>
</div>

<script>
    if (!window.supabaseClient) {
        window.supabaseClient = window.supabase.createClient(
            "https://zcffrkvxmxvojkbmtufe.supabase.co",
            "sb_publishable_lgKbPrSB163cJn-jNWAQCw_QdtqBvrG"
        );
    }
    const sb = window.supabaseClient;

    // ✅ الحالة الحالية
    let currentType = 'views';
    let currentPeriod = 'today';

    // ✅ وحدات القياس
    const unitLabels = {
        'views': { icon: '👁️', label: 'مشاهدة' },
        'posts': { icon: '📝', label: 'منشور' },
        'likes': { icon: '👍', label: 'إعجاب' },
        'comments': { icon: '💬', label: 'تعليق' }
    };

    async function loadLB(type, period, btn) {
        // ✅ إذا كانت type موجودة، فهي زر النوع
        if (type) {
            currentType = type;
            document.querySelectorAll('.type-tab').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }
        // ✅ إذا كانت period موجودة، فهي زر الفترة
        if (period) {
            currentPeriod = period;
            document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        const container = document.getElementById('leaderboard');
        if (!container) return;

        const loadingText = (typeof t === 'function') ? t('leaderboard_loading') : 'جاري التحميل...';
        container.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>${loadingText}</p></div>`;

        try {
            const { data, error } = await sb.rpc('get_leaderboard_by_type', {
                p_type: currentType,
                p_period: currentPeriod,
                p_limit: 20
            });

            if (error) {
                console.error(error);
                container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Error: ${error.message}</p></div>`;
                return;
            }

            if (!data || data.length === 0) {
                const noDataText = (typeof t === 'function') ? t('leaderboard_no_data') : 'لا توجد بيانات بعد';
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <h3>${noDataText}</h3>
                    </div>
                `;
                return;
            }

            const unit = unitLabels[currentType] || { icon: '', label: '' };

            container.innerHTML = data.map((user, i) => {
                const rank = i + 1;
                const rankClass = rank <= 3 ? `top-${rank}` : 'other';
                const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                const name = user.full_name || user.username || 'User';
                const avatar = user.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1877f2&color=fff`;

                return `
                    <a href="profile.html?id=${user.user_id}" class="lb-item">
                        <div class="lb-rank ${rankClass}">${rankIcon}</div>
                        <img class="lb-avatar" src="${avatar}">
                        <div class="lb-info">
                            <div class="lb-name">${name}</div>
                            <div class="lb-username">@${user.username || 'user'}</div>
                        </div>
                        <div class="lb-views">
                            <div class="lb-views-value">${(user.score || 0).toLocaleString()}</div>
                            <div class="lb-views-label">${unit.icon}</div>
                        </div>
                    </a>
                `;
            }).join('');
        } catch (err) {
            console.error(err);
            container.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Error</p></div>`;
        }
    }

    window.loadLB = loadLB;

         document.addEventListener('DOMContentLoaded', () => {
        loadLB('views', 'today', null);
        
        // تطبيق الترجمة عند فتح الصفحة
        const urlParams = new URLSearchParams(window.location.search);
        const urlLang = urlParams.get('lang');
        const savedLang = localStorage.getItem('socialwiki_lang') || 'ar';
        const finalLang = urlLang || savedLang;
        if (typeof changeLanguage === 'function') {
            changeLanguage(finalLang);
        }
    });

    function shareLeaderboard() {
        const url = window.location.origin + '/leaderboard.html';
        const text = '🏆 شوف قائمة المتصدرين على Wikidoogo!';
        
        if (navigator.share) {
            navigator.share({
                title: '🏆 المتصدرين - Wikidoogo',
                text: text,
                url: url
            }).catch(err => console.log('Share failed:', err));
        } else {
            navigator.clipboard.writeText(text + ' ' + url);
            alert('✅ تم نسخ الرابط!');
        }
    }
    window.shareLeaderboard = shareLeaderboard;

        // ✅ دالة فتح/إغلاق قائمة اللغات
    window.toggleLanguageMenu = function() {
        const menu = document.getElementById('languageMenu');
        if (menu) menu.classList.toggle('show');
    };
</script>

</body>
</html>
