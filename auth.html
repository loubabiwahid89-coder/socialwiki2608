<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialWiki </title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .auth-container {
            width: 380px;
            max-width: 95%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .auth-container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #1877f2;
            font-size: 24px;
        }

        /* ============================================================
           FOUNDER PROGRAM BANNER
        ============================================================ */
        .founder-banner {
            background: linear-gradient(135deg, #f7b928, #ffd700);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(247, 185, 40, 0.4);
            text-align: center;
            border: 2px solid #d4a017;
        }

        .founder-banner .founder-title {
            font-size: 16px;
            font-weight: 800;
            color: #333;
            margin-bottom: 8px;
        }

        .founder-banner .founder-text {
            font-size: 13px;
            color: #444;
            line-height: 1.6;
            margin: 0;
        }

        .founder-banner .founder-text strong {
            color: #b8860b;
            font-weight: 800;
        }

        /* ============================================================
           GOOGLE BUTTON
        ============================================================ */
        .google-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #ccc;
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        /* ============================================================
           EMAIL BUTTONS (Sign Up / Sign In)
        ============================================================ */
        .email-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .email-btn.signup-green {
            background: #42b72a;
            color: white;
        }

        .email-btn.signup-green:hover {
            background: #36a420;
        }

        .email-btn.signin-blue {
            background: #1877f2;
            color: white;
        }

        .email-btn.signin-blue:hover {
            background: #166fe5;
        }

        /* ============================================================
           DIVIDER
        ============================================================ */
        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        /* ============================================================
           FORM INPUTS
        ============================================================ */
        .auth-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .auth-container input:focus {
            border-color: #1877f2;
            outline: none;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group small {
            color: #65676b;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }

        /* ============================================================
           SUBMIT BUTTONS
        ============================================================ */
        .submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn.green {
            background: #42b72a;
        }

        .submit-btn.green:hover {
            background: #36a420;
        }

        .submit-btn.secondary {
            background: #e4e6eb;
            color: #050505;
        }

        .submit-btn.secondary:hover {
            background: #d8dadf;
        }

        .submit-btn.danger {
            background: transparent;
            color: #1877f2;
            font-size: 14px;
            margin-top: 5px;
        }

        .submit-btn.danger:hover {
            text-decoration: underline;
            background: transparent;
        }

        /* ============================================================
           TOGGLE LINK
        ============================================================ */
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #65676b;
        }

        .toggle-link a {
            color: #1877f2;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        /* ============================================================
           MESSAGE
        ============================================================ */
        #authMessage {
            text-align: center;
            margin-top: 15px;
            color: #333;
            font-size: 14px;
            min-height: 20px;
        }

        #authMessage.success {
            color: #42b72a;
            font-weight: 600;
        }

        #authMessage.error {
            color: #dc3545;
            font-weight: 600;
        }

        /* ============================================================
           LANGUAGE SELECTOR
        ============================================================ */
        .language-selector {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
            width: 100%;
        }

        .language-btn {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #1877f2;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            color: #1877f2;
            font-weight: 600;
        }

        .language-btn:hover {
            background: #e7f3ff;
        }

        .language-btn .arrow {
            margin-left: auto;
            font-size: 12px;
            color: #999;
        }

        .language-menu {
            display: none;
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 9999;
            overflow: hidden;
            border: 1px solid #e4e6eb;
        }

        .language-menu.show {
            display: block;
        }

        .language-menu button {
            width: 100%;
            padding: 12px 15px;
            border: none;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: all 0.2s;
            border-bottom: 1px solid #f0f2f5;
        }

        .language-menu button:hover {
            background: #e7f3ff;
            color: #1877f2;
            font-weight: 600;
        }

        .language-menu button:last-child {
            border-bottom: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <!-- LANGUAGE SELECTOR -->
        <div class="language-selector">
            <button class="language-btn" onclick="toggleLanguageMenu()">
                <span>🌐</span>
                <span id="currentLanguageLabel">العربية</span>
                <span class="arrow">▼</span>
            </button>
            <div class="language-menu" id="languageMenu">
                <button onclick="changeLanguage('ar')">🇸🇦 العربية</button>
                <button onclick="changeLanguage('fr')">🇫🇷 Français</button>
                <button onclick="changeLanguage('en')">🇬🇧 English</button>
            </div>
        </div>

        <!-- TITLE -->
        <h1 id="pageTitle">📘 SocialWiki</h1>

        <!-- 🎁 FOUNDER PROGRAM BANNER -->
        <div class="founder-banner">
            <div class="founder-title">🎁 أنت من المؤسسين الأوائل</div>
            <p class="founder-text">
                ستحصل على:<br>
                • <strong>525 نقطة</strong> (5.25$)<br>
                • <strong>شارة Founder ذهبية</strong>
            </p>
        </div>

        <!-- GOOGLE BUTTON -->
        <button class="google-btn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            <span id="googleBtnText">Sign in with Google</span>
        </button>

        <!-- 🟢 SIGN UP WITH EMAIL -->
        <button class="email-btn signup-green" onclick="showSignupForm()">
            ✨ <span id="signupEmailBtnText">Sign Up with Email</span>
        </button>

        <!-- ⚪ SIGN IN WITH EMAIL -->
        <button class="email-btn signin-blue" onclick="showLoginForm()">
            🔑 <span id="signinEmailBtnText">Sign In with Email</span>
        </button>

        <!-- DIVIDER -->
        <div class="divider">
            <span id="orText">أو</span>
        </div>

        <!-- FORM (Sign Up or Sign In) -->
        <div id="emailForm">
            <input type="email" id="email" placeholder="البريد الإلكتروني" dir="ltr">
            <input type="password" id="password" placeholder="كلمة المرور" dir="ltr">

            <div class="form-group" id="referralField">
                <input type="text" id="referralCodeInput" placeholder="🔑 كود الإحالة (اختياري)" dir="ltr">
                <small id="referralHint">
                    إذا كان لديك كود إحالة، أدخله لتحصل على مكافأة ترحيبية! 🎉
                </small>
            </div>

            <button id="signupButton" class="submit-btn green" onclick="signup()">إنشاء حساب</button>
            <button id="loginButton" class="submit-btn secondary" onclick="login()">تسجيل الدخول</button>
            <button id="forgotPasswordButton" class="submit-btn danger" type="button" onclick="forgotPassword()">نسيت كلمة المرور؟</button>
        </div>

        <!-- MESSAGE -->
        <p id="authMessage"></p>

        <!-- TOGGLE LINK -->
        <div class="toggle-link" id="toggleLink">
            <span id="toggleText">ليس لديك حساب؟</span>
            <a id="toggleAction" onclick="toggleMode()">إنشاء حساب جديد</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // =========================================================
        // TRANSLATIONS
        // =========================================================
        const translations = {
            ar: {
                title: '📘 SocialWiki',
                google_btn: 'تسجيل الدخول بواسطة Google',
                signup_email_btn: 'إنشاء حساب بالبريد',
                signin_email_btn: 'تسجيل الدخول بالبريد',
                or: 'أو',
                email_placeholder: 'البريد الإلكتروني',
                password_placeholder: 'كلمة المرور',
                referral_placeholder: '🔑 كود الإحالة (اختياري)',
                referral_hint: 'إذا كان لديك كود إحالة، أدخله لتحصل على مكافأة ترحيبية! 🎉',
                signup_btn: 'إنشاء حساب',
                login_btn: 'تسجيل الدخول',
                forgot_btn: 'نسيت كلمة المرور؟',
                toggle_text: 'ليس لديك حساب؟',
                toggle_action: 'إنشاء حساب جديد',
                toggle_text_login: 'لديك حساب؟',
                toggle_action_login: 'تسجيل الدخول',
                signup_title: '📘 إنشاء حساب',
                login_title: '📘 تسجيل الدخول',
                language_label: 'العربية',
                signup_success: '✅ تم التسجيل بنجاح! سيتم توجيهك إلى الصفحة الرئيسية.',
                login_success: '✅ تم تسجيل الدخول بنجاح!',
                forgot_success: '✅ تم إرسال رابط إعادة تعيين كلمة المرور',
                error_fill: '❌ الرجاء ملء البريد الإلكتروني وكلمة المرور',
                error_password: '❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل',
                error_email: '❌ الرجاء إدخال البريد الإلكتروني',
                welcome_bonus: '🎉 تم تفعيل كود الإحالة!'
            },
            fr: {
                title: '📘 SocialWiki',
                google_btn: 'Se connecter avec Google',
                signup_email_btn: 'Créer un compte par email',
                signin_email_btn: 'Se connecter par email',
                or: 'ou',
                email_placeholder: 'Adresse e-mail',
                password_placeholder: 'Mot de passe',
                referral_placeholder: '🔑 Code de parrainage (optionnel)',
                referral_hint: 'Entrez votre code de parrainage pour un bonus ! 🎉',
                signup_btn: 'Créer un compte',
                login_btn: 'Se connecter',
                forgot_btn: 'Mot de passe oublié ?',
                toggle_text: 'Pas de compte ?',
                toggle_action: 'Créer un compte',
                toggle_text_login: 'Vous avez un compte ?',
                toggle_action_login: 'Se connecter',
                signup_title: '📘 Créer un compte',
                login_title: '📘 Connexion',
                language_label: 'Français',
                signup_success: '✅ Inscription réussie !',
                login_success: '✅ Connexion réussie !',
                forgot_success: '✅ Lien envoyé par e-mail',
                error_fill: '❌ Remplissez tous les champs',
                error_password: '❌ Mot de passe : 6 caractères minimum',
                error_email: '❌ Entrez votre e-mail',
                welcome_bonus: '🎉 Code de parrainage activé !'
            },
            en: {
                title: '📘 SocialWiki',
                google_btn: 'Sign in with Google',
                signup_email_btn: 'Sign Up with Email',
                signin_email_btn: 'Sign In with Email',
                or: 'or',
                email_placeholder: 'Email',
                password_placeholder: 'Password',
                referral_placeholder: '🔑 Referral Code (optional)',
                referral_hint: 'Enter your referral code for a welcome bonus! 🎉',
                signup_btn: 'Create Account',
                login_btn: 'Login',
                forgot_btn: 'Forgot Password?',
                toggle_text: "Don't have an account?",
                toggle_action: 'Sign Up',
                toggle_text_login: 'Have an account?',
                toggle_action_login: 'Sign In',
                signup_title: '📘 Create Account',
                login_title: '📘 Login',
                language_label: 'English',
                signup_success: '✅ Sign up successful!',
                login_success: '✅ Login successful!',
                forgot_success: '✅ Reset link sent to your email',
                error_fill: '❌ Please fill in all fields',
                error_password: '❌ Password must be at least 6 characters',
                error_email: '❌ Please enter your email',
                welcome_bonus: '🎉 Referral code activated!'
            }
        };

        let currentLanguage = localStorage.getItem('socialwiki_lang') || 'ar';
        let isSignupMode = true;

        // =========================================================
        // LANGUAGE FUNCTIONS
        // =========================================================

        function applyTranslations(lang) {
            const t = translations[lang] || translations.ar;

            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('googleBtnText').textContent = t.google_btn;
            document.getElementById('signupEmailBtnText').textContent = t.signup_email_btn;
            document.getElementById('signinEmailBtnText').textContent = t.signin_email_btn;
            document.getElementById('orText').textContent = t.or;
            document.getElementById('email').placeholder = t.email_placeholder;
            document.getElementById('password').placeholder = t.password_placeholder;
            document.getElementById('referralCodeInput').placeholder = t.referral_placeholder;
            document.getElementById('referralHint').textContent = t.referral_hint;
            document.getElementById('signupButton').textContent = t.signup_btn;
            document.getElementById('loginButton').textContent = t.login_btn;
            document.getElementById('forgotPasswordButton').textContent = t.forgot_btn;
            document.getElementById('currentLanguageLabel').textContent = t.language_label;

            if (isSignupMode) {
                document.getElementById('toggleText').textContent = t.toggle_text;
                document.getElementById('toggleAction').textContent = t.toggle_action;
                document.querySelector('.auth-container h1').textContent = t.signup_title;
                document.getElementById('signupButton').style.display = 'block';
                document.getElementById('loginButton').style.display = 'none';
                document.getElementById('referralField').style.display = 'block';
            } else {
                document.getElementById('toggleText').textContent = t.toggle_text_login;
                document.getElementById('toggleAction').textContent = t.toggle_action_login;
                document.querySelector('.auth-container h1').textContent = t.login_title;
                document.getElementById('signupButton').style.display = 'none';
                document.getElementById('loginButton').style.display = 'block';
                document.getElementById('referralField').style.display = 'none';
            }

            if (lang === 'ar') {
                document.documentElement.dir = 'rtl';
                document.documentElement.lang = 'ar';
            } else {
                document.documentElement.dir = 'ltr';
                document.documentElement.lang = lang;
            }
        }

        function toggleLanguageMenu() {
            document.getElementById('languageMenu').classList.toggle('show');
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('socialwiki_lang', lang);
            applyTranslations(lang);
            document.getElementById('languageMenu').classList.remove('show');
        }

        // =========================================================
        // TOGGLE FORM: Sign Up <-> Sign In
        // =========================================================

        function showSignupForm() {
            isSignupMode = true;
            applyTranslations(currentLanguage);
            document.getElementById('authMessage').textContent = '';
            document.getElementById('authMessage').className = '';
        }

        function showLoginForm() {
            isSignupMode = false;
            applyTranslations(currentLanguage);
            document.getElementById('authMessage').textContent = '';
            document.getElementById('authMessage').className = '';
        }

        function toggleMode() {
            isSignupMode = !isSignupMode;
            applyTranslations(currentLanguage);
            document.getElementById('authMessage').textContent = '';
            document.getElementById('authMessage').className = '';
        }

        // =========================================================
        // SUPABASE SETUP
        // =========================================================

        const SUPABASE_URL = "https://hvslktufqrgdgrgxmvcm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // =========================================================
        // READ REFERRAL CODE FROM URL
        // =========================================================

        function getReferralCodeFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('ref');
        }

        // =========================================================
        // SIGNUP
        // =========================================================

        async function signup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const referralCode = document.getElementById('referralCodeInput').value.trim();
            const message = document.getElementById('authMessage');

            if (!email || !password) {
                message.textContent = translations[currentLanguage].error_fill;
                message.className = 'error';
                return;
            }

            if (password.length < 6) {
                message.textContent = translations[currentLanguage].error_password;
                message.className = 'error';
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { username: email.split('@')[0] }
                    }
                });

                if (error) {
                    message.textContent = '❌ ' + error.message;
                    message.className = 'error';
                    return;
                }

                if (!data.user) {
                    message.textContent = '❌ حدث خطأ في التسجيل';
                    message.className = 'error';
                    return;
                }

                // معالجة كود الإحالة
                if (referralCode) {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) {
                        await processReferral(referralCode, data.user.id);
                    }
                }

                message.textContent = translations[currentLanguage].signup_success;
                message.className = 'success';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                message.textContent = '❌ حدث خطأ: ' + error.message;
                message.className = 'error';
            }
        }

        // =========================================================
        // LOGIN
        // =========================================================

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const message = document.getElementById('authMessage');

            if (!email || !password) {
                message.textContent = translations[currentLanguage].error_fill;
                message.className = 'error';
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    message.textContent = '❌ ' + error.message;
                    message.className = 'error';
                    return;
                }

                message.textContent = translations[currentLanguage].login_success;
                message.className = 'success';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Error:', error);
                message.textContent = '❌ حدث خطأ: ' + error.message;
                message.className = 'error';
            }
        }

        // =========================================================
        // FORGOT PASSWORD
        // =========================================================

        async function forgotPassword() {
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('authMessage');

            if (!email) {
                message.textContent = translations[currentLanguage].error_email;
                message.className = 'error';
                return;
            }

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });

                if (error) {
                    message.textContent = '❌ ' + error.message;
                    message.className = 'error';
                    return;
                }

                message.textContent = translations[currentLanguage].forgot_success;
                message.className = 'success';

            } catch (error) {
                console.error('Error:', error);
                message.textContent = '❌ حدث خطأ: ' + error.message;
                message.className = 'error';
            }
        }

        // =========================================================
        // LOGIN WITH GOOGLE
        // =========================================================

        async function loginWithGoogle() {
            try {
                const referralCode = document.getElementById('referralCodeInput').value.trim();
                if (referralCode) {
                    localStorage.setItem('pendingReferralCode', referralCode);
                }

                const redirectUrl = window.location.origin + '/index.html';

                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: redirectUrl }
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // =========================================================
        // PROCESS REFERRAL
        // =========================================================

        async function processReferral(referralCode, newUserId) {
            try {
                const { data: { user: authUser } } = await supabaseClient.auth.getUser();
                if (!authUser) return;

                const referredId = authUser.id;

                const { data: referrer, error: refError } = await supabaseClient
                    .from('profiles')
                    .select('id, username')
                    .eq('referral_code', referralCode)
                    .maybeSingle();

                if (refError || !referrer) return;
                if (referrer.id === referredId) return;

                const { error: insertError } = await supabaseClient
                    .from('referrals')
                    .insert({
                        referrer_id: referrer.id,
                        referred_id: newUserId,
                        referral_code: referralCode,
                        points_awarded: 50
                    });

                if (insertError) {
                    console.error('❌ Error inserting referral:', insertError);
                }
            } catch (error) {
                console.error('❌ Error processing referral:', error);
            }
        }

        // =========================================================
        // INIT
        // =========================================================

        document.addEventListener('DOMContentLoaded', function() {
            const lang = localStorage.getItem('socialwiki_lang') || 'ar';
            currentLanguage = lang;
            applyTranslations(lang);

            const refCode = getReferralCodeFromURL();
            if (refCode) {
                const input = document.getElementById('referralCodeInput');
                if (input) {
                    input.value = refCode;
                    const message = document.getElementById('authMessage');
                    message.textContent = translations[currentLanguage].welcome_bonus;
                    message.className = 'success';
                }
                // افتح نموذج التسجيل تلقائياً عند وجود كود
                showSignupForm();
            }

            document.addEventListener('click', function(event) {
                const menu = document.getElementById('languageMenu');
                const btn = document.querySelector('.language-btn');
                if (menu && btn && !btn.contains(event.target) && !menu.contains(event.target)) {
                    menu.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
