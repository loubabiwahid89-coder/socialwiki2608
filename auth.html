<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialWiki - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .auth-container h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-container input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-container button:hover {
            opacity: 0.9;
        }

        #authMessage {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <h1>SocialWiki</h1>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="signupButton">
            Sign Up
        </button>

        <button id="loginButton">
            Login
        </button>

         <button id="forgotPasswordButton" type="button">
        Forgot Password?
    </button>

        <p id="authMessage"></p>

    </div>

    <!-- Supabase -->
   

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js?v=20260904"></script>

</body>
</html>
