<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger - SocialWiki</title>
    <link rel="stylesheet" href="socialwiki.css">
    <link rel="stylesheet" href="messenger.css">
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">📘 SocialWiki</a>
        </div>
        <ul class="nav-icons">
            <li><a href="index.html">🏠</a></li>
            <li><a href="friends.html">👥</a></li>
            <li><a href="market-plus.html">🛍️</a></li>
            <li><a href="events.html">📅</a></li>
            <li><a href="notifications.html">🔔</a></li>
            <li><a href="messenger.html" title="Messenger">💬</a></li>
        </ul>
        <div class="nav-right">
            <a href="profile.html" class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" id="navProfileImg" alt="Profile">
                <span id="navProfileName">User</span>
            </a>
            <button class="logout-button" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- MESSENGER PAGE -->
    <div class="messenger-page">

        <aside class="messenger-sidebar">
            <div class="messenger-title">
                <a href="index.html" class="messenger-home-button">← Home</a>
                <h1>Messenger</h1>
            </div>

            <div class="messenger-search">
                <input type="text" id="messengerSearch" placeholder="Search friends..." autocomplete="off">
            </div>
            <button id="showBlockedBtn" onclick="showBlockedUsers()" style="
    margin: 8px;
    padding: 10px 14px;
    background: #ffeaea;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    color: #c0392b;
    width: calc(100% - 16px);
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
">
    <span>🚫 Blocked Users</span>
    <span id="blockedCount" style="
        background: #c0392b;
        color: white;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 11px;
    ">0</span>
</button>

<div id="blockedList" style="display: none; padding: 8px;"></div>

            <div class="messenger-friends" id="messengerFriends">
                <div class="messenger-empty">Loading friends...</div>
            </div>
        </aside>

        <main class="messenger-chat">

            <div class="chat-header">
                <div class="chat-user" style="cursor:pointer;" onclick="goToChatProfile()">
                    <img id="chatUserAvatar" src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" alt="User">
                    <div>
                        <h2 id="chatUserName">Select a conversation</h2>
                        <span id="chatUserStatus">Choose a friend to start chatting</span>
                    </div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="chat-welcome">
                    <div class="chat-welcome-icon">💬</div>
                    <h2>Welcome to Messenger</h2>
                    <p>Select a friend from the list to start chatting.</p>
                </div>
            </div>

            <form class="message-form" id="messageForm">
                <button type="button" class="msg-tool-btn" id="emojiBtn" title="Emoji" disabled>😀</button>
                <button type="button" class="msg-tool-btn" id="imageBtn" title="Image" disabled>📷</button>
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
                
                <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" disabled>
                
                <button type="button" class="msg-tool-btn" id="voiceBtn" title="Voice" disabled>🎤</button>
                <button type="submit" id="sendMessageButton" disabled>Send</button>
                
                <div class="emoji-picker" id="emojiPicker" style="display:none;">
                    <div class="emoji-picker-header">
                        <span>Emojis</span>
                        <button type="button" onclick="closeEmojiPicker()" style="background:none;border:none;font-size:18px;cursor:pointer;">✕</button>
                    </div>
                    <div class="emoji-grid" id="emojiGrid"></div>
                </div>
            </form>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.supabaseClient = window.supabase.createClient(
            "https://zcffrkvxmxvojkbmtufe.supabase.co",
            "sb_publishable_lgKbPrSB163cJn-jNWAQCw_QdtqBvrG"
        );

        function logout() {
            window.supabaseClient.auth.signOut().then(() => {
                window.location.href = "auth.html";
            });
        }
    </script>
    <script src="js/messenger.js"></script>
          
<script>
    // تحديث اسم المستخدم في الهيدر
    (async function() {
        try {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return;

            const { data: profile } = await window.supabaseClient
                .from("profiles")
                .select("username, full_name, avatar_url")
                .eq("id", user.id)
                .single();

            if (!profile) return;

            const name = profile.full_name || profile.username || "User";
            const avatar = profile.avatar_url ||
                `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1877f2&color=fff`;

            const nameEl = document.getElementById("navProfileName");
            const imgEl = document.getElementById("navProfileImg");
            if (nameEl) nameEl.textContent = name;
            if (imgEl) imgEl.src = avatar;
        } catch (e) {
            console.warn("nav update error:", e);
        }
    })();
</script>
<script src="js/dark-mode.js"></script>
<!-- ✅ REPORT MODAL -->
<div id="reportModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:99999;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:16px;width:90%;max-width:450px;padding:25px;box-shadow:0 10px 40px rgba(0,0,0,0.4);">
        <h3 style="margin:0 0 15px;color:#050505;font-size:20px;">⚠️ Report</h3>
        <p id="reportTarget" style="margin:0 0 15px;color:#65676b;font-size:14px;"></p>

        <label style="display:block;font-weight:600;margin-bottom:8px;font-size:14px;color:#050505;">Reason</label>
        <select id="reportReason" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:15px;font-size:14px;background:white;color:#050505;">
            <option value="Spam">📧 Spam</option>
            <option value="Harassment">😠 Harassment</option>
            <option value="Fake account">👤 Fake account</option>
            <option value="Inappropriate content">🔞 Inappropriate content</option>
            <option value="Threat">⚠️ Threat</option>
            <option value="Other">📝 Other</option>
        </select>

        <label style="display:block;font-weight:600;margin-bottom:8px;font-size:14px;color:#050505;">Details (optional)</label>
        <textarea id="reportDetails" placeholder="Describe the issue..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:15px;font-size:14px;resize:vertical;min-height:80px;box-sizing:border-box;font-family:inherit;color:#050505;background:white;"></textarea>

        <label style="display:block;font-weight:600;margin-bottom:8px;font-size:14px;color:#050505;">Screenshot (optional)</label>
        <input type="file" id="reportScreenshot" accept="image/*" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;font-size:13px;background:white;box-sizing:border-box;">

        <div id="reportScreenshotPreview" style="display:none;margin-bottom:15px;text-align:center;">
            <img id="reportScreenshotImg" style="max-width:100%;max-height:150px;border-radius:8px;">
        </div>

        <div style="display:flex;gap:10px;margin-top:10px;">
            <button onclick="closeReportModal()" style="flex:1;padding:12px;border:none;border-radius:10px;background:#e4e6eb;color:#050505;font-weight:600;cursor:pointer;font-size:14px;">Cancel</button>
            <button onclick="submitReport()" id="reportSubmitBtn" style="flex:1;padding:12px;border:none;border-radius:10px;background:#f02849;color:white;font-weight:600;cursor:pointer;font-size:14px;">🚨 Send Report</button>
        </div>
    </div>
</div>
<script src="js/monetag.js" data-cfasync="false"></script>
<div class="adsterra-300x250" style="margin: 20px auto; text-align: center;"></div>
</body>
</html>
