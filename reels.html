<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialWiki</title>
    <link rel="stylesheet" href="socialwiki.css?v=999999">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js?v=20261001"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #000; color: white; margin: 0; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1877f2; padding: 0 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .navbar a { color: white; text-decoration: none; font-size: 20px; }
        .logo { font-weight: 800; font-size: 22px; }
        .reels-container { max-width: 500px; margin: 0 auto; padding: 20px; }

        .reel-card { background: #1a1a1a; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
        .reel-video { width: 100%; height: 600px; object-fit: cover; background: #000; display: block; }
        .reel-info { padding: 15px; }
        .reel-user { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .reel-avatar { width: 40px; height: 40px; border-radius: 50%; }
        .reel-username { font-weight: 700; }
        .reel-caption { font-size: 14px; margin-bottom: 12px; color: #ddd; }

        /* Reactions bar */
        .reel-reactions { display: flex; gap: 8px; margin-bottom: 12px; }
        .reaction-btn {
            background: #2a2a2a; border: none; color: white;
            padding: 8px 14px; border-radius: 20px;
            cursor: pointer; font-size: 18px;
            transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .reaction-btn:hover { background: #3a3a3a; transform: scale(1.05); }
        .reaction-btn.active { background: #1877f2; }

        /* Emoji picker */
        .emoji-picker {
            display: none; background: #2a2a2a; border-radius: 12px;
            padding: 10px; margin-bottom: 10px;
            flex-wrap: wrap; gap: 8px;
        }
        .emoji-picker.show { display: flex; }
        .emoji-picker button {
            background: none; border: none; font-size: 24px;
            cursor: pointer; padding: 5px; border-radius: 8px;
        }
        .emoji-picker button:hover { background: #3a3a3a; }

        /* Comments */
        .comments-section { margin-top: 15px; border-top: 1px solid #333; padding-top: 12px; }
        .comments-list { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .comment { display: flex; gap: 8px; margin-bottom: 10px; }
        .comment-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; }
        .comment-body { background: #2a2a2a; border-radius: 12px; padding: 8px 12px; flex: 1; }
        .comment-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
        .comment-text { font-size: 13px; color: #ddd; }

        .comment-input-row { display: flex; gap: 8px; }
        .comment-input {
            flex: 1; padding: 10px 15px; border-radius: 20px;
            border: none; background: #2a2a2a; color: white;
            outline: none; font-size: 14px;
        }
        .comment-send {
            background: #1877f2; border: none; color: white;
            width: 40px; height: 40px; border-radius: 50%;
            cursor: pointer; font-size: 18px;
        }

        .upload-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #1877f2; color: white; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(24,119,242,0.5); z-index: 100; }
        .empty { text-align: center; padding: 60px 20px; color: #65676b; }
        .empty-icon { font-size: 60px; margin-bottom: 15px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-box { background: #1a1a1a; border-radius: 12px; padding: 25px; width: 100%; max-width: 400px; }
        .modal-box h3 { margin: 0 0 15px; }
        .modal-box input, .modal-box textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; outline: none; }
        .modal-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; }
        .btn-primary { background: #1877f2; color: white; }
        .btn-cancel { background: #333; color: white; margin-top: 8px; }
    </style>
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">📘 SocialWiki</a>
    <a href="index.html">🏠</a>
</nav>

<div class="reels-container" id="reelsContainer">
    <div class="empty">
        <div class="empty-icon">🎬</div>
        <p>Loading reels...</p>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- 📢 EXOCLICK BANNER - REELS PAGE -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="ad-container" style="background: #1a1a1a; border-radius: 12px; padding: 20px; margin: 20px auto; text-align: center; min-height: 250px; display: flex; align-items: center; justify-content: center; flex-direction: column; max-width: 500px;">
    <div style="font-size: 11px; color: #65676b; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px;">
        📢 Sponsored
    </div>
    <div id="exoBannerContainer"></div>
</div>

<button class="upload-btn" onclick="openUploadModal()">+</button>

<div id="uploadModal" class="modal">
    <div class="modal-box">
        <h3>📤 Upload Reel</h3>
        <input type="file" id="reelFile" accept="video/*,image/*">
        <textarea id="reelCaption" placeholder="Caption..." rows="3"></textarea>
        <button class="btn-primary" onclick="uploadReel()">Upload</button>
        <button class="btn-cancel" onclick="closeUploadModal()">Cancel</button>
    </div>
</div>

<script>
    if (!window.supabaseClient) {
        window.supabaseClient = window.supabase.createClient(
            "https://zcffrkvxmxvojkbmtufe.supabase.co",
            "sb_publishable_lgKbPrSB163cJn-jNWAQCw_QdtqBvrG"
        );
    }

    const EMOJIS = ['❤️', '😂', '😮', '😢', '😡', '👍'];

   async function loadReels() {
    const container = document.getElementById('reelsContainer');
    try {
        const { data: reels, error } = await window.supabaseClient
            .from('reels')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);

        if (error) {
            console.error('Reels error:', error);
            container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>No reels yet</p></div>';
            return;
        }

        if (!reels || reels.length === 0) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">🎬</div><p>No reels yet. Be the first!</p></div>';
            return;
        }

        const userIds = reels.map(r => r.user_id);
        const { data: profiles } = await window.supabaseClient
            .from('profiles')
            .select('id, username, full_name, avatar_url')
            .in('id', userIds);

        const profilesMap = {};
        (profiles || []).forEach(p => profilesMap[p.id] = p);

        container.innerHTML = '';
        for (const reel of reels) {
            const profile = profilesMap[reel.user_id] || {};
            const username = profile.full_name || profile.username || 'User';
            const avatar = profile.avatar_url || `https://ui-avatars.com/api/?name=${username}&background=1877f2&color=fff`;
            
const url = (reel.video_url || '').toLowerCase();
const isVideo = /\.(mp4|webm|mov|avi|mkv|m4v)$/i.test(url);

            const mediaHTML = isVideo
                ? `<video class="reel-video" src="${reel.video_url}" controls playsinline loop></video>`
                : `<img class="reel-video" src="${reel.video_url}" style="object-fit:contain;">`;

            const div = document.createElement('div');
            div.className = 'reel-card';
            div.innerHTML = `
                ${mediaHTML}
                <div class="reel-info">
                    <div class="reel-user">
                        <img class="reel-avatar" src="${avatar}">
                        <span class="reel-username">${username}</span>
                    </div>
                    <div class="reel-caption">${reel.caption || ''}</div>

                    <div class="reel-reactions">
                        <button class="reaction-btn" onclick="toggleReaction('${reel.id}', '❤️', this)">❤️</button>
                        <button class="reaction-btn" onclick="toggleReaction('${reel.id}', '😂', this)">😂</button>
                        <button class="reaction-btn" onclick="toggleReaction('${reel.id}', '😮', this)">😮</button>
                        <button class="reaction-btn" onclick="toggleReaction('${reel.id}', '😢', this)">😢</button>
                        <button class="reaction-btn" onclick="toggleReaction('${reel.id}', '👍', this)">👍</button>
                    </div>

                    <div class="comments-section">
                        <div class="comments-list" id="comments_${reel.id}"></div>
                        <div class="comment-input-row">
                            <input class="comment-input" id="input_${reel.id}" placeholder="Write a comment..." onkeypress="if(event.key === 'Enter') addReelComment('${reel.id}')">
                            <button class="comment-send" onclick="addReelComment('${reel.id}')">➤</button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);
            loadReelComments(reel.id);
        }
    } catch (e) {
        console.error('Error:', e);
        container.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Error loading reels</p></div>';
    }
}
    async function toggleReaction(reelId, emoji, btn) {
        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { alert('Please login'); return; }

        const { data: existing } = await window.supabaseClient
            .from('reel_reactions')
            .select('id, emoji')
            .eq('reel_id', reelId)
            .eq('user_id', user.id)
            .maybeSingle();

        if (existing) {
            if (existing.emoji === emoji) {
                await window.supabaseClient.from('reel_reactions').delete().eq('id', existing.id);
                btn.classList.remove('active');
                return;
            } else {
                await window.supabaseClient.from('reel_reactions').update({ emoji }).eq('id', existing.id);
                document.querySelectorAll(`.reaction-btn`).forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                return;
            }
        }

        await window.supabaseClient.from('reel_reactions').insert({
            reel_id: reelId, user_id: user.id, emoji: emoji
        });
        btn.classList.add('active');
    }

    async function loadReelComments(reelId) {
        const { data: comments } = await window.supabaseClient
            .from('reel_comments')
            .select('*')
            .eq('reel_id', reelId)
            .order('created_at', { ascending: true })
            .limit(20);

        const container = document.getElementById(`comments_${reelId}`);
        if (!container) return;

        if (!comments || comments.length === 0) {
            container.innerHTML = '<p style="color:#65676b;font-size:13px;">No comments yet</p>';
            return;
        }

        const userIds = comments.map(c => c.user_id);
        const { data: profiles } = await window.supabaseClient
            .from('profiles').select('id, username, full_name, avatar_url').in('id', userIds);

        const profilesMap = {};
        (profiles || []).forEach(p => profilesMap[p.id] = p);

        container.innerHTML = '';
        comments.forEach(c => {
            const p = profilesMap[c.user_id] || {};
            const name = p.full_name || p.username || 'User';
            const av = p.avatar_url || `https://ui-avatars.com/api/?name=${name}&background=1877f2&color=fff`;
            const div = document.createElement('div');
            div.className = 'comment';
            div.innerHTML = `
                <img class="comment-avatar" src="${av}">
                <div class="comment-body">
                    <div class="comment-name">${name}</div>
                    <div class="comment-text">${c.content}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    async function addReelComment(reelId) {
        const input = document.getElementById(`input_${reelId}`);
        if (!input) return;
        const content = input.value.trim();
        if (!content) return;

        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { alert('Please login'); return; }

        const { error } = await window.supabaseClient.from('reel_comments').insert({
            reel_id: reelId, user_id: user.id, content: content
        });

        if (error) { alert('Error: ' + error.message); return; }

        input.value = '';
        loadReelComments(reelId);
    }

    function openUploadModal() {
        document.getElementById('uploadModal').classList.add('show');
    }
    function closeUploadModal() {
        document.getElementById('uploadModal').classList.remove('show');
    }

    async function uploadReel() {
        const file = document.getElementById('reelFile').files[0];
        const caption = document.getElementById('reelCaption').value.trim();

        if (!file) { alert('Please select a video or image'); return; }

        const { data: { user } } = await window.supabaseClient.auth.getUser();
        if (!user) { alert('Please login'); return; }

        const isVideo = file.type.startsWith('video/');
        const mediaType = isVideo ? 'video' : 'image';

        try {
            const fileName = `${user.id}/${Date.now()}.${file.name.split('.').pop()}`;
            const { error: upErr } = await window.supabaseClient.storage
                .from('reels').upload(fileName, file);

            if (upErr) { alert('Upload error: ' + upErr.message); return; }

            const { data: urlData } = window.supabaseClient.storage
                .from('reels').getPublicUrl(fileName);

            const { error } = await window.supabaseClient
                .from('reels')
                .insert({
                    user_id: user.id,
                    video_url: urlData.publicUrl,
                    caption: caption,
                    media_type: mediaType
                });

            if (error) { alert('Error: ' + error.message); return; }

            alert('✅ Reel uploaded!');
            closeUploadModal();
            loadReels();
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    document.addEventListener('DOMContentLoaded', loadReels);
</script>
<script src="js/dark-mode.js"></script>

<!-- 🎬 PRE-ROLL AD MODAL (نسخة واحدة فقط) -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div id="prerollModal" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.98);
    z-index: 999999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
">
    <div style="text-align: center; color: white; margin-bottom: 15px;">
        <div style="font-size: 13px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7;">
            📢 Advertisement
        </div>
    </div>

    <div id="prerollAdContainer" style="
        background: white;
        border-radius: 12px;
        padding: 20px;
        max-width: 360px;
        min-width: 320px;
        min-height: 280px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    ">
    </div>

    <button id="prerollSkipBtn" disabled style="
        margin-top: 25px;
        padding: 14px 45px;
        background: rgba(255,255,255,0.15);
        color: white;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 30px;
        font-size: 15px;
        font-weight: 600;
        cursor: not-allowed;
        transition: all 0.3s;
        font-family: inherit;
    ">
        Skip in 5...
    </button>

    <div style="color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 15px;">
        Your video will play after the ad
    </div>
</div>

<script>
// =========================================================
// PRE-ROLL AD SYSTEM (نسخة واحدة فقط)
// =========================================================
(function() {
    'use strict';

    let prerollTimer = null;
    let prerollCallback = null;
    let prerollActive = false;

    const NATIVE_AD_SCRIPT = 'https://pl31577799.profitableratecpmnetwork.com/1af43291506a9f729cf5b2e0c450d957/invoke.js';
    const NATIVE_AD_CONTAINER = 'container-1af43291506a9f729cf5b2e0c450d957';
    const SKIP_DELAY = 5;

    window.showPrerollAd = function(callback) {
        const modal = document.getElementById('prerollModal');
        const adContainer = document.getElementById('prerollAdContainer');
        const skipBtn = document.getElementById('prerollSkipBtn');

        if (!modal || !adContainer || !skipBtn) {
            if (callback) callback();
            return;
        }

        if (prerollActive) return;
        prerollActive = true;
        prerollCallback = callback;

        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        adContainer.innerHTML = '';

        const adScript = document.createElement('script');
        adScript.async = true;
        adScript.setAttribute('data-cfasync', 'false');
        adScript.src = NATIVE_AD_SCRIPT;
        adContainer.appendChild(adScript);

        const adDiv = document.createElement('div');
        adDiv.id = NATIVE_AD_CONTAINER;
        adContainer.appendChild(adDiv);

        let countdown = SKIP_DELAY;
        skipBtn.disabled = true;
        skipBtn.textContent = `Skip in ${countdown}...`;
        skipBtn.style.cursor = 'not-allowed';
        skipBtn.style.opacity = '0.6';
        skipBtn.style.background = 'rgba(255,255,255,0.15)';
        skipBtn.style.borderColor = 'rgba(255,255,255,0.3)';

        clearInterval(prerollTimer);
        prerollTimer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                skipBtn.textContent = `Skip in ${countdown}...`;
            } else {
                clearInterval(prerollTimer);
                skipBtn.disabled = false;
                skipBtn.textContent = '⏭️ Skip Ad';
                skipBtn.style.cursor = 'pointer';
                skipBtn.style.opacity = '1';
                skipBtn.style.background = '#1877f2';
                skipBtn.style.borderColor = '#1877f2';
            }
        }, 1000);

        skipBtn.onclick = () => {
            if (skipBtn.disabled) return;
            closePreroll();
        };
    };

    function closePreroll() {
        const modal = document.getElementById('prerollModal');
        const adContainer = document.getElementById('prerollAdContainer');

        if (modal) modal.style.display = 'none';
        document.body.style.overflow = '';
        clearInterval(prerollTimer);
        prerollActive = false;

        if (adContainer) adContainer.innerHTML = '';

        const cb = prerollCallback;
        prerollCallback = null;
        if (cb) cb();
    }

    window.closePreroll = closePreroll;
    console.log('✅ Pre-roll system ready');
})();

// =========================================================
// ✅ ربط Pre-roll بفيديو واحد بس كل جلسة
// =========================================================
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        const videos = document.querySelectorAll('.reel-video');

        if (videos.length === 0) return;

        let prerollShownInSession = sessionStorage.getItem('reelPrerollShown');

        videos.forEach((video) => {
            video.addEventListener('play', function onceHandler(e) {
                if (prerollShownInSession) return;

                video.pause();

                showPrerollAd(() => {
                    sessionStorage.setItem('reelPrerollShown', '1');
                    video.play();
                });

                videos.forEach(v => v.removeEventListener('play', onceHandler));
            });
        });

        console.log(`🎬 Pre-roll will show once per session`);
    }, 2000);
});
</script>
</body>
