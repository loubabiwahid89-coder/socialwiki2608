<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Manager - SocialWiki</title>
    <link rel="stylesheet" href="socialwiki.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0;
            color: #050505;
        }
        
        /* NAVBAR */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1877f2;
            padding: 0 16px;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .logo { color: white; font-size: 24px; font-weight: 800; text-decoration: none; }
        .nav-icons {
            display: flex; align-items: center; gap: 8px;
            list-style: none; margin: 0; padding: 0;
        }
        .nav-icons a {
            color: white; font-size: 20px; text-decoration: none;
            padding: 8px; border-radius: 50%;
        }
        .nav-icons a:hover { background: rgba(255,255,255,0.2); }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-profile {
            display: flex; align-items: center; gap: 8px;
            color: white; text-decoration: none;
            padding: 5px 10px; border-radius: 50px;
        }
        .nav-profile img { width: 32px; height: 32px; border-radius: 50%; }
        .logout-button {
            background: rgba(255,255,255,0.2); border: none;
            padding: 8px 16px; border-radius: 20px;
            color: white; cursor: pointer; font-size: 14px;
        }
        
        /* BACK & HOME BUTTONS */
        .nav-buttons {
            padding: 10px 20px;
            background: #f0f2f5;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .nav-buttons a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        .back-btn {
            color: #65676b;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .home-btn {
            color: white;
            background: #1877f2;
        }
        
        /* CONTAINER */
        .ad-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .ad-header h1 { margin: 0; font-size: 28px; }
        .ad-header p { margin: 5px 0 0; color: #65676b; font-size: 14px; }
        
        .create-ad-btn {
            background: #1877f2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .create-ad-btn:hover { background: #166fe5; }
        
        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        .stat-icon { font-size: 30px; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: 700; color: #1877f2; }
        .stat-label { font-size: 13px; color: #65676b; margin-top: 4px; }
        
        /* TABLE (Desktop) */
        .ads-table-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        .ads-table-container h3 {
            margin: 0 0 15px;
            font-size: 18px;
        }
        .ads-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        .ads-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #e4e6eb;
            color: #65676b;
            font-size: 13px;
            font-weight: 600;
        }
        .ads-table td {
            padding: 12px;
            border-bottom: 1px solid #e4e6eb;
            font-size: 14px;
            vertical-align: middle;
        }
        .ads-table tr:hover { background: #f9f9f9; }
        
        .ad-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #f0f2f5;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.active { background: #e7f7e7; color: #28a745; }
        .status-badge.paused { background: #fff4e5; color: #f0ad4e; }
        .status-badge.pending { background: #e5f0ff; color: #1877f2; }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        .action-btn {
            background: #f0f2f5;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .action-btn:hover { background: #e4e6eb; }
        .action-btn.delete:hover { background: #ffebee; color: #f44336; }
        
        /* CARDS (Mobile) */
        .ads-cards {
            display: none;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .ad-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .ad-card-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .ad-card-header img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .ad-card-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .ad-card-budget { color: #1877f2; font-weight: 600; font-size: 14px; }
        .ad-card-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: #65676b;
        }
        .ad-card-actions {
            display: flex;
            gap: 8px;
        }
        .ad-card-actions .action-btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
        }
        
        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #65676b;
        }
        .empty-state-icon { font-size: 60px; margin-bottom: 15px; }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.show { display: flex; }
        .modal-box {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .cancel-button,
        .submit-button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        .cancel-button { background: #e4e6eb; }
        .submit-button { background: #1877f2; color: white; }
        
        /* RESPONSIVE */
        @media (max-width: 900px) {
            .ads-table-container { display: none; }
            .ads-cards { display: grid; }
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .ad-header { flex-direction: column; align-items: stretch; }
            .ad-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- BACK & HOME BUTTONS -->
    <div class="nav-buttons">
        <a href="javascript:history.back()" class="back-btn" data-i18n="back">← Back</a>
        <a href="index.html" class="home-btn" data-i18n="home_btn">🏠 Home</a>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">📘 SocialWiki</a>
        </div>
        <ul class="nav-icons">
            <li><a href="index.html">🏠</a></li>
            <li><a href="friends.html">👥</a></li>
            <li><a href="market-plus.html">🛍️</a></li>
            <li><a href="events.html">📅</a></li>
            <li><a href="notifications.html">🔔</a></li>
        </ul>
        <div class="nav-right">
            <a href="profile.html" class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" id="navProfileImg" alt="Profile">
                <span id="navProfileName">User</span>
            </a>
            
            <!-- زر اللغة -->
            <div class="language-selector" style="position: relative;">
                <button id="languageButton" class="language-btn" onclick="toggleLanguageMenu()" style="width: auto; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; font-size: 14px; padding: 0 15px;">🌐</button>
                <div class="language-menu" id="languageMenu" style="display: none; position: absolute; top: 45px; right: 0; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9999; min-width: 180px; max-height: 400px; overflow-y: auto;">
                    <button onclick="changeLanguage('ar')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇲🇦 العربية</button>
                    <button onclick="changeLanguage('fr')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇫🇷 Français</button>
                    <button onclick="changeLanguage('en')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇬🇧 English</button>
                    <button onclick="changeLanguage('es')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇪🇸 Español</button>
                    <button onclick="changeLanguage('de')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇩🇪 Deutsch</button>
                    <button onclick="changeLanguage('it')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇮🇹 Italiano</button>
                    <button onclick="changeLanguage('ja')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇯🇵 日本語</button>
                    <button onclick="changeLanguage('zh')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇨🇳 中文</button>
                    <button onclick="changeLanguage('ko')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇰🇷 한국어</button>
                    <button onclick="changeLanguage('ru')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇷🇺 Русский</button>
                    <button onclick="changeLanguage('tr')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇹🇷 Türkçe</button>
                    <button onclick="changeLanguage('hi')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇮🇳 हिन्दी</button>
                </div>
            </div>
            
            <button class="logout-button" onclick="logout()" data-i18n="logout">Logout</button>
        </div>
    </nav>

    <!-- AD MANAGER CONTAINER -->
    <div class="ad-container">

        <!-- HEADER -->
        <div class="ad-header">
            <div>
                <h1 data-i18n="ad_manager_title">📊 Ad Manager</h1>
                <p data-i18n="ad_manager_subtitle">Create and manage your ad campaigns</p>
            </div>
            <button class="create-ad-btn" onclick="openAdModal()" data-i18n="create_ad">+ Create New Ad</button>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalAds">0</div>
                <div class="stat-label" data-i18n="total_ads">Total Ads</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="activeAds">0</div>
                <div class="stat-label" data-i18n="active_ads">Active Ads</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="totalSpent">0 MAD</div>
                <div class="stat-label" data-i18n="total_spent">Total Spent</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👁️</div>
                <div class="stat-value" id="totalImpressions">0</div>
                <div class="stat-label" data-i18n="total_impressions">Impressions</div>
            </div>
        </div>

        <!-- TABLE (Desktop) -->
        <div class="ads-table-container">
            <h3 data-i18n="my_ads">My Ads</h3>
            <table class="ads-table">
                <thead>
                    <tr>
                        <th data-i18n="ad_image">Image</th>
                        <th data-i18n="ad_title">Title</th>
                        <th data-i18n="ad_budget">Budget</th>
                        <th data-i18n="ad_status_pending">Status</th>
                        <th data-i18n="total_impressions">Impressions</th>
                        <th data-i18n="edit">Actions</th>
                    </tr>
                </thead>
                <tbody id="adsTableBody">
                    <!-- سيتم تعبئتها بـ JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- CARDS (Mobile) -->
        <div class="ads-cards" id="adsCardsContainer">
            <!-- سيتم تعبئتها بـ JavaScript -->
        </div>

    </div>

    <!-- AD MODAL -->
    <div id="adModal" class="modal">
        <div class="modal-box">
            <div class="modal-title" data-i18n="create_ad">+ Create New Ad</div>
            
            <form id="adForm" onsubmit="createAd(event)">
                <div class="form-group">
                    <label data-i18n="ad_title">Ad Title</label>
                    <input type="text" id="adTitle" required data-i18n-placeholder="enter_ad_title" placeholder="Enter ad title">
                </div>
                
                <div class="form-group">
                    <label data-i18n="ad_description">Description</label>
                    <textarea id="adDescription" data-i18n-placeholder="describe_ad" placeholder="Describe your ad..."></textarea>
                </div>
                
                <div class="form-group">
                    <label data-i18n="ad_image">Ad Image</label>
                    <input type="file" id="adImage" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label data-i18n="ad_target_url">Target URL</label>
                    <input type="url" id="adTargetUrl" data-i18n-placeholder="enter_target_url" placeholder="https://example.com">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="ad_budget">Budget</label>
                        <input type="number" id="adBudget" required data-i18n-placeholder="enter_budget" placeholder="100">
                    </div>
                    <div class="form-group">
                        <label data-i18n="ad_currency">Currency</label>
                        <select id="adCurrency">
                            <option value="MAD">MAD</option>
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="ad_start_date">Start Date</label>
                        <input type="date" id="adStartDate">
                    </div>
                    <div class="form-group">
                        <label data-i18n="ad_end_date">End Date</label>
                        <input type="date" id="adEndDate">
                    </div>
                </div>
                
                <div class="form-group">
                    <label data-i18n="ad_target_audience">Target Audience</label>
                    <input type="text" id="adAudience" data-i18n-placeholder="enter_audience" placeholder="e.g., 18-35, Morocco">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="cancel-button" onclick="closeAdModal()" data-i18n="cancel">Cancel</button>
                    <button type="submit" class="submit-button" data-i18n="publish_ad">✅ Publish Ad</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script>
        // Supabase setup
        const SUPABASE_URL = "https://hvslktufqrgdgrgxmvcm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;

        // Logout
        function logout() {
            supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        }

        // Load user profile
        async function loadUserProfile() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                currentUserId = user.id;
                
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('username, full_name, avatar_url')
                    .eq('id', user.id)
                    .single();
                    
                const username = profile?.username || profile?.full_name || 'User';
                const avatarUrl = profile?.avatar_url || `https://ui-avatars.com/api/?name=${username}&background=1877f2&color=fff`;
                document.getElementById('navProfileName').textContent = username;
                document.getElementById('navProfileImg').src = avatarUrl;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Open/Close Modal
        function openAdModal() {
            document.getElementById('adModal').classList.add('show');
        }
        function closeAdModal() {
            document.getElementById('adModal').classList.remove('show');
            document.getElementById('adForm').reset();
        }

        // Load ads
        async function loadAds() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;

                const { data: ads, error } = await supabaseClient
                    .from('ads')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.log('Ads table not found yet, using empty list');
                    displayAds([]);
                    return;
                }

                displayAds(ads || []);
                updateStats(ads || []);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Update stats
        function updateStats(ads) {
            const total = ads.length;
            const active = ads.filter(a => a.status === 'active').length;
            const spent = ads.reduce((sum, a) => sum + (parseFloat(a.spent) || 0), 0);
            const impressions = ads.reduce((sum, a) => sum + (parseInt(a.views_count) || 0), 0);

            document.getElementById('totalAds').textContent = total;
            document.getElementById('activeAds').textContent = active;
            document.getElementById('totalSpent').textContent = spent.toFixed(2) + ' MAD';
            document.getElementById('totalImpressions').textContent = impressions;
        }

        // Display ads (table + cards)
        function displayAds(ads) {
            const tableBody = document.getElementById('adsTableBody');
            const cardsContainer = document.getElementById('adsCardsContainer');

            if (!ads || ads.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#65676b;" data-i18n="no_ads_manager">You haven't created any ads yet</td></tr>`;
                cardsContainer.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><p data-i18n="no_ads_manager">You haven't created any ads yet</p></div>`;
                applyTranslations();
                return;
            }

            tableBody.innerHTML = '';
            cardsContainer.innerHTML = '';

            ads.forEach(ad => {
                const statusClass = ad.status === 'active' ? 'active' : ad.status === 'paused' ? 'paused' : 'pending';
                const statusText = ad.status === 'active' ? 'Active' : ad.status === 'paused' ? 'Paused' : 'Pending';
                const imageUrl = ad.image_url || 'https://via.placeholder.com/50';
                const budget = `${ad.budget || 0} ${ad.currency || 'MAD'}`;
                const impressions = ad.impressions || 0;

                // Table row
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><img src="${imageUrl}" class="ad-thumbnail" onerror="this.src='https://via.placeholder.com/50'"></td>
                    <td><strong>${escapeHtml(ad.title)}</strong></td>
                    <td>${budget}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${impressions}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn" onclick="toggleStatus('${ad.id}', '${ad.status}')">${ad.status === 'active' ? '⏸️' : '▶️'}</button>
                            <button class="action-btn delete" onclick="deleteAd('${ad.id}')">🗑️</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);

                // Card (mobile)
                const card = document.createElement('div');
                card.className = 'ad-card';
                card.innerHTML = `
                    <div class="ad-card-header">
                        <img src="${imageUrl}" onerror="this.src='https://via.placeholder.com/60'">
                        <div>
                            <div class="ad-card-title">${escapeHtml(ad.title)}</div>
                            <div class="ad-card-budget">${budget}</div>
                        </div>
                    </div>
                    <div class="ad-card-info">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                        <span>👁️ ${impressions}</span>
                    </div>
                    <div class="ad-card-actions">
                        <button class="action-btn" onclick="toggleStatus('${ad.id}', '${ad.status}')">${ad.status === 'active' ? '⏸️ Pause' : '▶️ Resume'}</button>
                        <button class="action-btn delete" onclick="deleteAd('${ad.id}')">🗑️ Delete</button>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });

            applyTranslations();
        }

        // Create Ad
                async function createAd(event) {
            event.preventDefault();

            const title = document.getElementById('adTitle').value.trim();
            const description = document.getElementById('adDescription').value.trim();
            const targetUrl = document.getElementById('adTargetUrl').value.trim();
            const budget = document.getElementById('adBudget').value;
            const currency = document.getElementById('adCurrency').value;
            const startDate = document.getElementById('adStartDate').value;
            const endDate = document.getElementById('adEndDate').value;
            const audience = document.getElementById('adAudience').value.trim();
            const imageFile = document.getElementById('adImage').files[0];

            if (!title || !budget) {
                alert('Please fill all required fields!');
                return;
            }

            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    alert('Please login first!');
                    return;
                }

                let imageUrl = null;
                if (imageFile) {
                    const fileName = `ads/${user.id}/${Date.now()}_${imageFile.name}`;
                    const { error: uploadError } = await supabaseClient.storage
                        .from('ad-images')
                        .upload(fileName, imageFile);

                    if (uploadError) {
                        console.error('Upload error:', uploadError);
                        alert('Error uploading image: ' + uploadError.message);
                        return;
                    }

                    const { data: urlData } = supabaseClient.storage
                        .from('ad-images')
                        .getPublicUrl(fileName);
                    imageUrl = urlData.publicUrl;
                }

                            const { error } = await supabaseClient
                    .from('ads')
                    .insert({
                        user_id: user.id,
                        title: title,
                        description: description,
                        image_url: imageUrl,
                        link: targetUrl,
                        budget: parseFloat(budget),
                        currency: currency,
                        start_date: startDate || null,
                        end_date: endDate || null,
                        target_audience: audience,
                        status: 'pending',
                        spent: 0,
                        views_count: 0,
                        clicks_count: 0,
                        points_reward: 0
                    });

                if (error) {
                    console.error('Error creating ad:', error);
                    alert('Error creating ad: ' + error.message);
                    return;
                }

                alert('✅ Ad created successfully!');
                closeAdModal();
                loadAds();

            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred: ' + error.message);
            }
        }

        // Toggle status
        async function toggleStatus(adId, currentStatus) {
            const newStatus = currentStatus === 'active' ? 'paused' : 'active';
            try {
                const { error } = await supabaseClient
                    .from('ads')
                    .update({ status: newStatus })
                    .eq('id', adId);

                if (error) {
                    console.error('Error updating status:', error);
                    return;
                }
                loadAds();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Delete ad
        async function deleteAd(adId) {
            if (!confirm('Are you sure you want to delete this ad?')) return;
            try {
                const { error } = await supabaseClient
                    .from('ads')
                    .delete()
                    .eq('id', adId);

                if (error) {
                    console.error('Error deleting ad:', error);
                    return;
                }
                alert('✅ Ad deleted!');
                loadAds();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getCurrentLanguage();
            setLanguage(lang);
            applyTranslations();

            loadUserProfile();
            loadAds();
        });
    </script>
</body>
</html>
