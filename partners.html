<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partners - Wikidoogo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f0f2f5;font-family:Segoe UI,Arial,sans-serif;color:#050505}
.nav{background:#1877f2;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.nav a{color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
h1,h2{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.p{display:flex;align-items:center;gap:10px;background:#f7f8fa;border-radius:10px;padding:10px;text-decoration:none;color:inherit}
.p img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.tag{font-size:12px;background:#31a24c;color:#fff;border-radius:20px;padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input.link{flex:1;min-width:200px;padding:10px;border:1px solid #ccc;border-radius:8px}
button{padding:10px 16px;border:0;border-radius:8px;background:#1877f2;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="nav"><a href="index.html">Wikidoogo</a><a href="index.html">Home</a></div>
<div class="wrap">
<div class="card" id="dash" style="display:none">
<h2>Partner Dashboard</h2>
<p>Your referral link:</p>
<div class="row"><input class="link" id="refLink" readonly><button onclick="copyRef()">Copy</button></div>
<div class="row" style="margin-top:12px"><div class="p"><div><div style="font-size:24px;font-weight:700" id="stRef">0</div>Referrals</div></div><div class="p"><div><div style="font-size:24px;font-weight:700" id="stPts">0</div>Points earned</div></div></div><p style="color:#65676b">Tasks and commissions: coming soon.</p>
</div>
<div class="card"><h1>Our Partners</h1><div class="grid" id="list">Loading...</div></div>
</div>
<script>
const sb = window.supabase.createClient("https://zcffrkvxmxvojkbmtufe.supabase.co", "sb_publishable_lgKbPrSB163cJn-jNWAQCw_QdtqBvrG");
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function copyRef(){var i=document.getElementById('refLink');i.select();document.execCommand('copy');alert('Copied!');}
async function loadDash(uid){const pf=await sb.from('profiles').select('referral_code').eq('id',uid).single();const code=pf.data&&pf.data.referral_code;document.getElementById('refLink').value=code?'https://wikidoogo.com/auth.html?ref='+code:'No referral code yet';const rf=await sb.from('referrals').select('points_awarded').eq('referrer_id',uid);const rows=rf.data||[];document.getElementById('stRef').textContent=rows.length;document.getElementById('stPts').textContent=rows.reduce(function(t,r){return t+(r.points_awarded||0);},0);}
(async function(){
  const list=document.getElementById('list');
  const pr=await sb.from('partners').select('user_id,referral_code').eq('status','active');
  const partners=pr.data||[];
  if(!partners.length){list.textContent='No partners yet.';return;}
  const ids=partners.map(function(p){return p.user_id;});
  const pf=await sb.from('profiles').select('id,username,full_name,avatar_url').in('id',ids);
  list.innerHTML=(pf.data||[]).map(function(u){
    const name=u.full_name||u.username||'User';
    const av=u.avatar_url||'https://ui-avatars.com/api/?name='+encodeURIComponent(name)+'&background=1877f2&color=fff';
    return '<a class="p" href="profile.html?id='+u.id+'"><img src="'+esc(av)+'"><div><div>'+esc(name)+'</div><span class="tag">Partner</span></div></a>';
  }).join('');
  const me=await sb.auth.getUser();
  const uid=me.data&&me.data.user?me.data.user.id:null;
  const mine=partners.find(function(p){return p.user_id===uid;});
  if(mine){document.getElementById('dash').style.display='block';loadDash(uid);}
})();
</script>
</body>
</html>
