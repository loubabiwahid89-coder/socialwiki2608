<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SocialWiki - Reset Password</title>

    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f0f2f5;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }


        .reset-container {

            width: 350px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.15);

        }


        .reset-container h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        .reset-container p {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        .reset-container input {

            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            margin-bottom: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

        }


        .reset-container button {

            width: 100%;

            padding: 12px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #1877f2;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .reset-container button:hover {

            opacity: 0.9;

        }


        #resetMessage {

            text-align: center;

            margin-top: 15px;

        }

    </style>

</head>


<body>


    <div class="reset-container">

        <h1>SocialWiki</h1>

        <p>Reset your password</p>


        <input
            type="password"
            id="newPassword"
            placeholder="New Password"
        >


        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm New Password"
        >


        <button id="resetPasswordButton">
            Update Password
        </button>


        <p id="resetMessage"></p>

    </div>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        console.log(
            "🔥 RESET PASSWORD PAGE LOADED"
        );


        // =====================================================
        // SUPABASE
        // =====================================================

        const SUPABASE_URL =
            "https://hvslktufqrgdgrgxmvcm.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";


       const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// CHECK RECOVERY URL
// =====================================================

console.log(
    "Current URL:",
    window.location.href
);

console.log(
    "URL HASH:",
    window.location.hash
);

        // =====================================================
        // ELEMENTS
        // =====================================================

        const newPasswordInput =
            document.getElementById(
                "newPassword"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const resetPasswordButton =
            document.getElementById(
                "resetPasswordButton"
            );


        const resetMessage =
            document.getElementById(
                "resetMessage"
            );


        // =====================================================
        // MESSAGE
        // =====================================================

        function showResetMessage(message) {

            resetMessage.textContent =
                message;

            console.log(message);

        }


        // =====================================================
        // =====================================================
// =====================================================
// PASSWORD RECOVERY SESSION
// =====================================================

let recoveryReady = false;

supabaseClient.auth.onAuthStateChange(
    async function(event, session) {

        console.log(
            "Auth event:",
            event
        );

        console.log(
            "Session:",
            session
        );

        if (
            event === "PASSWORD_RECOVERY" &&
            session
        ) {

            recoveryReady = true;

            console.log(
                "✅ Password recovery session detected."
            );

            showResetMessage(
                "Enter your new password."
            );

        }

    }
);
        // =====================================================
        // UPDATE PASSWORD
        // =====================================================

        resetPasswordButton.addEventListener(
            "click",
            async function() {

                const newPassword =
                    newPasswordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                if (
                    !newPassword ||
                    !confirmPassword
                ) {

                    showResetMessage(
                        "Please enter your new password."
                    );

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showResetMessage(
                        "Passwords do not match."
                    );

                    return;

                }


                if (
                    newPassword.length < 6
                ) {

                    showResetMessage(
                        "Password must be at least 6 characters."
                    );

                    return;

                }


                showResetMessage(
                    "Updating password..."
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.updateUser({

                        password:
                            newPassword

                    });


                if (error) {

                    console.error(
                        "❌ Password update error:",
                        error
                    );


                    showResetMessage(
                        error.message
                    );

                    return;

                }


                console.log(
                    "✅ Password updated successfully.",
                    data
                );


                showResetMessage(
                    "Password updated successfully! You can now log in."
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "auth.html";

                    },
                    2000
                );

            }
        );

    </script>

</body>

</html>
