<!-- =====================================================
     HEADER
===================================================== -->

<header class="market-header">
<a
href="index.html"
class="back-button"
id="homeLink"

>
← Home

</a>

<div>

<h1
    class="market-title"
    id="marketTitle"
>
    ⭐ Market Plus
</h1>

<p
    class="market-subtitle"
    id="marketSubtitle"
>
    Discover products and special offers
</p>


</div>

</header>

<!-- =====================================================
     MAIN
===================================================== -->

<main class="market-container">

<section class="market-tools">

<div class="search-box">

   <div class="search-box">

    <span>🔎</span>

    <input
        type="text"
        id="productSearch"
        placeholder="Search products..."
        autocomplete="off"
    >

    <select id="productSort">
        <option value="newest">🆕 Newest</option>
        <option value="oldest">🕐 Oldest</option>
        <option value="price_low">💰 Price: Low → High</option>
        <option value="price_high">💰 Price: High → Low</option>
    </select>

</div>
</div>

<select
    id="languageSelect"
    class="language-select"
>

    <option value="en">
        🇬🇧 English
    </option>

    <option value="fr">
        🇫🇷 Français
    </option>

    <option value="ar">
        🇸🇦 العربية
    </option>

</select>

<select
    id="currencySelect"
    class="currency-select"
>

    <option value="USD">
        $ USD
    </option>

    <option value="EUR">
        € EUR
    </option>

    <option value="MAD">
        د.م. MAD
    </option>

</select>

<button
    class="add-product-button"
    id="addProductButton"
>
    ➕ Add Product
</button>


</section>

<div
    id="statusBox"
    class="status-box"
></div>

<!-- =====================================================
     CATEGORIES + FAVORITES
===================================================== -->

<section class="categories">


<button
    class="category-button active"
    data-category="all"
>
    🛍️ All
</button>

<button
    class="category-button"
    id="myProductsButton"
    data-category="my-products"
>
    👤 My Products
</button>

<button
    class="category-button"
    data-category="electronics"
>
    📱 Electronics
</button>

<button
    class="category-button"
    data-category="fashion"
>
    👕 Fashion
</button>

<button
    class="category-button"
    data-category="home"
>
    🏠 Home
</button>

<button
    class="category-button"
    data-category="gaming"
>
    🎮 Gaming
</button>

<button
    class="category-button"
    id="favoritesButton"
    data-category="favorites"
>
    🤍 Favorites
</button>


</section>

<div
    id="loadingBox"
    class="loading-box"
>
    ⏳ Loading products...
</div>

<section
    id="productsGrid"
    class="products-grid"
></section>

<div
    id="noResults"
    class="no-results"
>
    🔎 No products found.
</div>

</main>

<!-- =====================================================
     ADD / EDIT PRODUCT MODAL
===================================================== -->

<div
    id="productModal"
    class="modal-overlay"
>

<div class="modal">


<div class="modal-header">

    <h2 id="modalTitle">
        ➕ Add Product
    </h2>

    <button
        class="close-modal"
        id="closeModalButton"
        type="button"
    >
        ✕
    </button>

</div>

<form id="productForm">

    <div class="form-group">

        <label for="productName">
            Product Name
        </label>

        <input
            type="text"
            id="productName"
            required
            maxlength="120"
        >

    </div>

    <div class="form-group">

        <label for="productDescription">
            Description
        </label>

        <textarea
            id="productDescription"
            maxlength="1000"
        ></textarea>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label for="productCategory">
                Category
            </label>

            <select
                id="productCategory"
                required
            >

                <option value="electronics">
                    📱 Electronics
                </option>

                <option value="fashion">
                    👕 Fashion
                </option>

                <option value="home">
                    🏠 Home
                </option>

                <option value="gaming">
                    🎮 Gaming
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="productCondition">
                Condition
            </label>

            <select id="productCondition">

                <option value="new">
                    New
                </option>

                <option value="used">
                    Used
                </option>

                <option value="like_new">
                    Like New
                </option>

            </select>

        </div>

    </div>

    <div class="form-row">

        <div class="form-group">

            <label for="productPrice">
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                min="0"
                step="0.01"
                required
            >

        </div>

        <div class="form-group">

            <label for="productCurrency">
                Currency
            </label>

            <select id="productCurrency">

                <option value="USD">
                    $ USD
                </option>

                <option value="EUR">
                    € EUR
                </option>

                <option value="MAD">
                    د.م. MAD
                </option>

            </select>

        </div>

    </div>

    <div class="form-group">

        <label for="productLocation">
            Location
        </label>

        <input
            type="text"
            id="productLocation"
            maxlength="150"
            placeholder="City / Country"
        >

    </div>

    <div class="form-group">

        <label
            for="productImageFile"
            id="productImageLabel"
        >
            📷 Product Image
        </label>

        <div class="image-upload-box">

            <input
                type="file"
                id="productImageFile"
                class="image-upload-input"
                accept="image/*"
            >

            <p
                class="image-help"
                id="imageHelp"
            >
                JPG, PNG, WEBP — maximum 5 MB
            </p>

            <img
                id="productImagePreview"
                class="image-preview"
                alt="Product preview"
            >

        </div>

    </div>

    <div class="modal-actions">

        <button
            type="button"
            class="cancel-button"
            id="cancelModalButton"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="save-product-button"
            id="saveProductButton"
        >
            Publish Product
        </button>

    </div>

</form>


</div>

</div>

<!-- =====================================================
     PRODUCT DETAILS MODAL
===================================================== -->

<div class="product-details-footer">

/* =====================================================
   TOGGLE FAVORITE
===================================================== */

async function toggleFavorite(
    product,
    event
) {

    if (event) {

        event.preventDefault();
        event.stopPropagation();

    }

    if (!currentUser) {

        showStatus(
            translations[
                currentLanguage
            ].loginRequired,
            "error"
        );

        return;

    }

    if (!product || !product.id) {

        return;

    }

    const isFavorite =
        favoriteProductIds.has(
            product.id
        );

    const button =
        event?.currentTarget ||
        null;

    if (button) {

        button.disabled = true;

    }

    try {

        if (isFavorite) {

            const {
                error
            } =
                await marketSupabase
                    .from("market_favorites")
                    .delete()
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "product_id",
                        product.id
                    );

            if (error) {

                throw error;

            }

            favoriteProductIds.delete(
                product.id
            );

            showStatus(
                translations[
                    currentLanguage
                ].favoriteRemoved,
                "success"
            );

        } else {

            const {
                error
            } =
                await marketSupabase
                    .from("market_favorites")
                    .insert({

                        user_id:
                            currentUser.id,

                        product_id:
                            product.id

                    });

            if (error) {

                throw error;

            }

            favoriteProductIds.add(
                product.id
            );

            showStatus(
                translations[
                    currentLanguage
                ].favoriteAdded,
                "success"
            );

        }

        renderProducts();

    } catch (error) {

        console.error(
            "❌ Toggle favorite error:",
            error
        );

        showStatus(
            "❌ " +
            (
                error.message ||
                translations[
                    currentLanguage
                ].error
            ),
            "error"
        );

    } finally {

        if (button) {

            button.disabled = false;

        }

    }

}

/* =====================================================
   UPLOAD PRODUCT IMAGE
===================================================== */

async function uploadProductImage(file) {

    if (!marketSupabase) {

        throw new Error(
            "Supabase is not available."
        );

    }

    if (!currentUser) {

        throw new Error(
            "Please log in first."
        );

    }

    if (!file) {

        return null;

    }

    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            );

    const safeName =
        file.name
            .replace(
                /\.[^/.]+$/,
                ""
            )
            .replace(
                /[^a-zA-Z0-9_-]/g,
                "-"
            )
            .slice(
                0,
                80
            ) ||
        "product";

    const filePath =
        currentUser.id +
        "/" +
        Date.now() +
        "-" +
        safeName +
        "." +
        extension;

    console.log(
        "☁️ Uploading image:",
        filePath
    );

    const {
        error: uploadError
    } =
        await marketSupabase
            .storage
            .from("market-products")
            .upload(
                filePath,
                file,
                {
                    cacheControl:
                        "3600",

                    upsert:
                        false,

                    contentType:
                        file.type
                }
            );

    if (uploadError) {

        console.error(
            "❌ Image upload error:",
            uploadError
        );

        throw uploadError;

    }

    const {
        data
    } =
        marketSupabase
            .storage
            .from("market-products")
            .getPublicUrl(
                filePath
            );

    if (!data?.publicUrl) {

        throw new Error(
            "Could not get image public URL."
        );

    }

    console.log(
        "✅ Image uploaded:",
        data.publicUrl
    );

    return {

        url:
            data.publicUrl,

        path:
            filePath

    };

}


/* =====================================================
   GET STORAGE PATH
===================================================== */

function getStoragePathFromUrl(url) {

    if (!url) {

        return null;

    }

    const marker =
        "/storage/v1/object/public/market-products/";

    const index =
        url.indexOf(
            marker
        );

    if (index === -1) {

        return null;

    }

    return decodeURIComponent(
        url.slice(
            index +
            marker.length
        )
    );

}


/* =====================================================
   DELETE STORAGE IMAGE
===================================================== */

async function deleteStorageImage(url) {

    const path =
        getStoragePathFromUrl(
            url
        );

    if (!path) {

        return;

    }

    try {

        const {
            error
        } =
            await marketSupabase
                .storage
                .from(
                    "market-products"
                )
                .remove([
                    path
                ]);

        if (error) {

            console.warn(
                "⚠️ Could not delete image:",
                error
            );

            return;

        }

        console.log(
            "🗑️ Storage image deleted:",
            path
        );

    } catch (error) {

        console.warn(
            "⚠️ Storage delete failed:",
            error
        );

    }

}

/* =====================================================
   FORMAT PRICE
===================================================== */

function formatProductPrice(product) {

    const originalCurrency =
        product.currency ||
        "USD";

    const originalPrice =
        Number(
            product.price
        );

    if (
        !Number.isFinite(
            originalPrice
        )
    ) {

        return "";

    }

    const originalRate =
        currencyRates[
            originalCurrency
        ] || 1;

    const targetRate =
        currencyRates[
            currentCurrency
        ] || 1;

    const usdValue =
        originalPrice /
        originalRate;

    const converted =
        usdValue *
        targetRate;

    const config =
        currencyConfig[
            currentCurrency
        ];

    let locale =
        "en-US";

    if (
        currentLanguage ===
        "fr"
    ) {

        locale =
            "fr-FR";

    }

    if (
        currentLanguage ===
        "ar"
    ) {

        locale =
            "ar-MA";

    }

    const formatted =
        new Intl.NumberFormat(
            locale,
            {
                minimumFractionDigits:
                    2,

                maximumFractionDigits:
                    2
            }
        ).format(
            converted
        );

    if (
        config.position ===
        "before"
    ) {

        return (
            config.symbol +
            formatted
        );

    }

    return (
        formatted +
        " " +
        config.symbol
    );

}

/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(event) {

    event.preventDefault();

    if (!currentUser) {

        showStatus(
            translations[
                currentLanguage
            ].loginRequired,
            "error"
        );

        return;

    }

    const name =
        document.getElementById(
            "productName"
        ).value.trim();

    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();

    const category =
        document.getElementById(
            "productCategory"
        ).value;

    const condition =
        document.getElementById(
            "productCondition"
        ).value;

    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );

    const currency =
        document.getElementById(
            "productCurrency"
        ).value;

    const location =
        document.getElementById(
            "productLocation"
        ).value.trim();

    if (
        !name ||
        !Number.isFinite(price) ||
        price < 0
    ) {

        showStatus(
            "❌ Please enter a valid name and price.",
            "error"
        );

        return;

    }

    saveProductButton.disabled =
        true;

    const originalEditingId =
        editingProductId;

    const wasEditing =
        Boolean(
            originalEditingId
        );

    try {

        let finalImageUrl =
            existingImageUrl ||
            null;

        let uploadedImagePath =
            null;

        if (selectedImageFile) {

            saveProductButton.textContent =
                translations[
                    currentLanguage
                ].uploadingImage;

            const uploadResult =
                await uploadProductImage(
                    selectedImageFile
                );

            if (!uploadResult) {

                throw new Error(
                    "Image upload failed."
                );

            }

            finalImageUrl =
                uploadResult.url;

            uploadedImagePath =
                uploadResult.path;

        }

        saveProductButton.textContent =
            translations[
                currentLanguage
            ].savingProduct;

        const productData = {

            name:
                name,

            description:
                description ||
                null,

            category:
                category,

            price:
                price,

            currency:
                currency,

            location:
                location ||
                null,

            condition:
                condition ||
                null,

            image_url:
                finalImageUrl

        };

        let result;

        if (originalEditingId) {

            result =
                await marketSupabase
                    .from(
                        "market_products"
                    )
                    .update(
                        productData
                    )
                    .eq(
                        "id",
                        originalEditingId
                    )
                    .eq(
                        "seller_id",
                        currentUser.id
                    )
                    .select()
                    .single();

        } else {

            result =
                await marketSupabase
                    .from(
                        "market_products"
                    )
                    .insert({

                        seller_id:
                            currentUser.id,

                        ...productData

                    })
                    .select()
                    .single();

        }

        if (result.error) {

            if (uploadedImagePath) {

                try {

                    await marketSupabase
                        .storage
                        .from(
                            "market-products"
                        )
                        .remove([
                            uploadedImagePath
                        ]);

                } catch (
                    cleanupError
                ) {

                    console.warn(
                        "⚠️ Uploaded image cleanup failed:",
                        cleanupError
                    );

                }

            }

            throw result.error;

        }

        console.log(
            "✅ Product saved:",
            result.data
        );

        if (
            wasEditing &&
            selectedImageFile &&
            existingImageUrl &&
            existingImageUrl !==
                finalImageUrl
        ) {

            await deleteStorageImage(
                existingImageUrl
            );

        }

        closeProductModal();

        showStatus(
            wasEditing
                ? translations[
                    currentLanguage
                  ].productUpdated
                : translations[
                    currentLanguage
                  ].productCreated,
            "success"
        );

        await loadProducts();

    } catch (error) {

        console.error(
            "❌ Save product error:",
            error
        );

        showStatus(
            "❌ " +
            (
                error.message ||
                translations[
                    currentLanguage
                ].error
            ),
            "error"
        );

    } finally {

        saveProductButton.disabled =
            false;

        saveProductButton.textContent =
            wasEditing
                ? translations[
                    currentLanguage
                  ].update
                : translations[
                    currentLanguage
                  ].publish;

    }

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(productId) {

    if (!currentUser) {

        showStatus(
            translations[
                currentLanguage
            ].loginRequired,
            "error"
        );

        return;

    }

    const product =
        products.find(
            item =>
                item.id ===
                productId
        );

    if (!product) {
        return;
    }

    if (
        product.seller_id !==
        currentUser.id
    ) {

        showStatus(
            "❌ You can only delete your own products.",
            "error"
        );

        return;

    }

    const confirmed =
        window.confirm(
            "Delete this product?"
        );

    if (!confirmed) {
        return;
    }

    const {
        error
    } =
        await marketSupabase
            .from(
                "market_products"
            )
            .delete()
            .eq(
                "id",
                productId
            )
            .eq(
                "seller_id",
                currentUser.id
            );

    if (error) {

        console.error(
            "❌ Delete product error:",
            error
        );

        showStatus(
            "❌ " +
            error.message,
            "error"
        );

        return;

    }

    /* Remove locally too */
    favoriteProductIds.delete(
        productId
    );

    if (product.image_url) {

        await deleteStorageImage(
            product.image_url
        );

    }

    showStatus(
        translations[
            currentLanguage
        ].productDeleted,
        "success"
    );

    await loadProducts();

}

    function () {

        closeProductModal();

    }
);

cancelModalButton.addEventListener(
    "click",
    function () {

        closeProductModal();

    }
);

productModal.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            productModal
        ) {

            closeProductModal();

        }

    }
);


/* =====================================================
   CLOSE PRODUCT DETAILS
===================================================== */

productDetailsCloseButton.addEventListener(
    "click",
    function () {

        closeProductDetails();

    }
);

productDetailsCloseBottom.addEventListener(
    "click",
    function () {

        closeProductDetails();

    }
);

productDetailsOverlay.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            productDetailsOverlay
        ) {

            closeProductDetails();

        }

    }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Escape"
        ) {

            if (
                productDetailsOverlay.style.display ===
                "block"
            ) {

                closeProductDetails();

            }

            if (
                productModal.style.display ===
                "block"
            ) {

                closeProductModal();

            }

        }

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

async function initializeMarketPlus() {

    console.log(
        "🛒 Market Plus starting..."
    );

    currentUser =
        await getCurrentUser();

    if (currentUser) {

        console.log(
            "👤 Current user:",
            currentUser.id
        );

        console.log(
            "📧 Current email:",
            currentUser.email
        );

    } else {

        console.log(
            "ℹ️ No active session"
        );

    }


    /* ================================================
       LOAD SAVED LANGUAGE
    ================================================ */

    const savedLanguage =
        localStorage.getItem(
            "socialwiki_language"
        );

    if (
        savedLanguage &&
        translations[
            savedLanguage
        ]
    ) {

        currentLanguage =
            savedLanguage;

    }

    languageSelect.value =
        currentLanguage;

    currencySelect.value =
        currentCurrency;


    /* ================================================
       LOAD FAVORITES FIRST
    ================================================ */

    await loadFavorites();


    /* ================================================
       APPLY LANGUAGE
    ================================================ */

    applyLanguage(
        currentLanguage
    );


    /* ================================================
       ALL BUTTON ACTIVE
    ================================================ */

    const allButton =
        document.querySelector(
            '[data-category="all"]'
        );

    if (allButton) {

        allButton.classList.add(
            "active"
        );

    }


    /* ================================================
       LOAD PRODUCTS
    ================================================ */

    await loadProducts();


    console.log(
        "✅ Market Plus ready"
    );

}


/* =====================================================
   START
===================================================== */

initializeMarketPlus();

</script>
