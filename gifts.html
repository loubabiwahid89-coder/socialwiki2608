<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifts - SocialWiki</title>
    <link rel="stylesheet" href="socialwiki.css?v=999999">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0;
            color: #050505;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            background: #1877f2; padding: 0 16px; height: 56px;
            position: sticky; top: 0; z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .logo { color: white; font-size: 24px; font-weight: 800; text-decoration: none; }
        .nav-icons { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; }
        .nav-icons a { color: white; font-size: 20px; text-decoration: none; padding: 8px; border-radius: 50%; }
        .nav-icons a:hover { background: rgba(255,255,255,0.2); }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-profile { display: flex; align-items: center; gap: 8px; color: white; text-decoration: none; padding: 5px 10px; border-radius: 50px; }
        .nav-profile img { width: 32px; height: 32px; border-radius: 50%; }
        .logout-button { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 20px; color: white; cursor: pointer; font-size: 14px; }
        .nav-buttons { padding: 10px 20px; background: #f0f2f5; display: flex; gap: 10px; align-items: center; }
        .nav-buttons a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; padding: 8px 16px; border-radius: 20px; font-size: 14px; }
        .home-btn { color: white; background: #1877f2; }

        /* ========== CONTAINER ========== */
        .gifts-container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* ========== HEADER ========== */
        .gifts-header {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, #1877f2, #4facfe);
            border-radius: 16px; padding: 30px; color: white;
            margin-bottom: 25px; flex-wrap: wrap; gap: 15px;
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.3);
        }
        .gifts-header h1 { margin: 0 0 8px; font-size: 32px; }
        .gifts-header p { margin: 0; font-size: 16px; opacity: 0.95; }

        .header-right {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }

        .balance-display {
            background: white; padding: 15px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .balance-display .icon { font-size: 24px; }
        .balance-display .amount { font-size: 24px; font-weight: 800; color: #1877f2; }
        .balance-display .label { font-size: 13px; color: #65676b; }

        .buy-points-btn {
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #333; text-decoration: none;
            padding: 15px 25px; border-radius: 50px;
            font-weight: 800; font-size: 15px;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
            transition: 0.2s;
        }
        .buy-points-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.6);
        }

        /* ========== FILTERS ========== */
        .filters {
            display: flex; gap: 10px; margin-bottom: 20px;
            flex-wrap: wrap; overflow-x: auto;
            padding-bottom: 5px;
        }
        .filter-btn {
            padding: 10px 20px; border: 2px solid #e4e6eb;
            background: white; border-radius: 25px; cursor: pointer;
            font-size: 14px; font-weight: 600; color: #65676b;
            transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover { border-color: #1877f2; color: #1877f2; }
        .filter-btn.active {
            background: #1877f2; color: white; border-color: #1877f2;
        }
        .filter-btn.free.active { background: #28a745; border-color: #28a745; }
        .filter-btn.legendary.active {
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #333; border-color: #ffd700;
        }

        /* ========== GIFTS GRID ========== */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .gift-card {
            background: white; border-radius: 16px; padding: 25px 20px;
            text-align: center; cursor: pointer; transition: 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .gift-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(24, 119, 242, 0.25);
            border-color: #1877f2;
        }
        .gift-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #1877f2, #4facfe);
            opacity: 0; transition: 0.3s;
        }
        .gift-card:hover::before { opacity: 1; }

        /* Card colors by category */
        .gift-card[data-category="free"]:hover { border-color: #28a745; }
        .gift-card[data-category="free"]::before { background: linear-gradient(90deg, #28a745, #5dd37a); }
        .gift-card[data-category="small"]:hover { border-color: #cd7f32; }
        .gift-card[data-category="small"]::before { background: linear-gradient(90deg, #cd7f32, #daa06d); }
        .gift-card[data-category="medium"]:hover { border-color: #94a3b8; }
        .gift-card[data-category="medium"]::before { background: linear-gradient(90deg, #94a3b8, #cbd5e1); }
        .gift-card[data-category="big"]:hover { border-color: #ffd700; }
        .gift-card[data-category="big"]::before { background: linear-gradient(90deg, #ffd700, #ffed4e); }
        .gift-card[data-category="premium"]:hover { border-color: #a855f7; }
        .gift-card[data-category="premium"]::before { background: linear-gradient(90deg, #a855f7, #c084fc); }
        .gift-card[data-category="legendary"]:hover { border-color: #ef4444; box-shadow: 0 12px 30px rgba(239, 68, 68, 0.3); }
        .gift-card[data-category="legendary"]::before { background: linear-gradient(90deg, #ffd700, #ef4444, #a855f7); }

        .gift-icon {
            font-size: 60px; margin-bottom: 15px;
            display: inline-block; transition: 0.3s;
        }
        .gift-card:hover .gift-icon {
            transform: scale(1.15) rotate(-5deg);
        }
        .gift-name {
            font-weight: 700; font-size: 16px;
            color: #050505; margin-bottom: 10px;
            min-height: 40px;
        }
        .gift-cost {
            display: inline-flex; align-items: center; gap: 5px;
            background: #f0f2f5; padding: 6px 14px;
            border-radius: 20px; font-size: 14px;
            font-weight: 700; color: #1877f2;
        }
        .gift-cost.free-cost {
            background: linear-gradient(135deg, #d4edda, #a8e6b8);
            color: #155724;
        }

        .gift-category-badge {
            position: absolute; top: 10px; right: 10px;
            font-size: 10px; padding: 3px 8px;
            border-radius: 8px; font-weight: 700;
            text-transform: uppercase;
        }
        .gift-category-badge.free { background: #d4edda; color: #155724; }
        .gift-category-badge.small { background: #fce7d4; color: #8b4513; }
        .gift-category-badge.medium { background: #e2e8f0; color: #475569; }
        .gift-category-badge.big { background: #fff9c4; color: #b45309; }
        .gift-category-badge.premium { background: #f3e8ff; color: #7c3aed; }
        .gift-category-badge.legendary {
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #333;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .free-label {
            position: absolute; top: 10px; left: 10px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white; padding: 3px 10px;
            border-radius: 8px; font-size: 10px;
            font-weight: 800; letter-spacing: 0.5px;
        }

        .loading-spinner {
            grid-column: 1 / -1; text-align: center;
            padding: 60px; color: #65676b; font-size: 16px;
        }

        /* ========== MODAL ========== */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); align-items: center;
            justify-content: center; z-index: 9999; padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-box {
            background: white; border-radius: 20px;
            padding: 30px; width: 100%; max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-height: 90vh; overflow-y: auto;
            animation: modalSlide 0.3s ease-out;
        }
        @keyframes modalSlide {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .modal-title { font-size: 22px; font-weight: 700; margin: 0; color: #050505; }
        .modal-close {
            background: #f0f2f5; border: none; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; font-size: 18px;
            color: #65676b; transition: 0.2s;
        }
        .modal-close:hover { background: #e4e6eb; color: #050505; }

        .gift-preview {
            text-align: center; padding: 25px;
            background: linear-gradient(135deg, #f0f7ff, #e5f0ff);
            border-radius: 16px; margin-bottom: 20px;
            position: relative;
        }
        .gift-preview.free-preview {
            background: linear-gradient(135deg, #d4edda, #a8e6b8);
        }
        .gift-preview.legendary-preview {
            background: linear-gradient(135deg, #fff9c4, #ffe082);
            border: 3px solid #ffd700;
        }
        .gift-preview .icon { font-size: 70px; margin-bottom: 10px; }
        .gift-preview .name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .gift-preview .cost {
            display: inline-block; background: #1877f2;
            color: white; padding: 8px 20px;
            border-radius: 20px; font-weight: 700;
        }
        .gift-preview .cost.free-cost {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-weight: 600;
            margin-bottom: 8px; font-size: 14px; color: #050505;
        }
        .form-group select, .form-group textarea, .form-group input {
            width: 100%; padding: 12px 15px;
            border: 2px solid #e4e6eb; border-radius: 10px;
            font-size: 15px; outline: none; transition: 0.2s;
            font-family: inherit;
            background: white;
        }
        .form-group select:focus, .form-group textarea:focus {
            border-color: #1877f2;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .modal-actions {
            display: flex; gap: 10px; margin-top: 20px;
        }
        .modal-actions button {
            flex: 1; padding: 14px; border: none;
            border-radius: 10px; cursor: pointer;
            font-weight: 700; font-size: 15px;
            transition: 0.2s;
        }
        .btn-cancel { background: #e4e6eb; color: #050505; }
        .btn-cancel:hover { background: #d8dadf; }
        .btn-send {
            background: linear-gradient(135deg, #1877f2, #4facfe);
            color: white;
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4);
        }
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.5);
        }
        .btn-send:disabled {
            opacity: 0.6; cursor: not-allowed;
            transform: none;
        }
        .btn-send.free-send {
            background: linear-gradient(135deg, #28a745, #20c997);
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center; padding: 60px 20px;
            grid-column: 1 / -1; color: #65676b;
        }
        .empty-state-icon { font-size: 60px; margin-bottom: 15px; }

        /* ========== TOAST ========== */
        .toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white; padding: 16px 30px;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-weight: 700; z-index: 99999;
            display: flex; align-items: center; gap: 10px;
            transition: transform 0.4s ease-out;
            border-right: 4px solid #28a745;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-right-color: #f02849; }
        .toast .toast-icon { font-size: 22px; }

        /* ========== FULL SCREEN ANIMATION (TikTok style) ========== */
              .gift-animation {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 999999; pointer-events: none;
            animation: fadeInOut 4s ease-out forwards;
            overflow: hidden;
        }
        .gift-animation .emoji {
            font-size: 200px;
            animation: explode 4s ease-out;
            filter: drop-shadow(0 0 40px rgba(255,215,0,0.8));
        }
        .gift-animation .gift-label {
            font-size: 32px;
            font-weight: 800;
            color: white;
            margin-top: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            animation: slideUp 4s ease-out;
            z-index: 10;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; }
            10% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes explode {
            0% { transform: scale(0) rotate(0deg); }
            20% { transform: scale(1.8) rotate(15deg); }
            50% { transform: scale(1.5) rotate(-10deg); }
            80% { transform: scale(1.6) rotate(5deg); }
            100% { transform: scale(3) rotate(-20deg); opacity: 0; }
        }
        @keyframes slideUp {
            0% { transform: translateY(50px); opacity: 0; }
            20% { transform: translateY(0); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ffd700;
            opacity: 0.9;
            animation: confettiFall 3s linear forwards;
            z-index: 5;
            top: -20px;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Legendary special effect */
        .gift-animation.legendary-anim {
            background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, rgba(0,0,0,0.95) 70%);
        }
        .gift-animation.legendary-anim .emoji {
            animation: legendaryPulse 4s ease-out;
            filter: drop-shadow(0 0 60px rgba(255,215,0,1)) drop-shadow(0 0 100px rgba(255,100,0,0.8));
        }
               @keyframes legendaryPulse {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            10% { transform: scale(2) rotate(20deg); opacity: 1; }
            30% { transform: scale(1.4) rotate(-15deg); }
            50% { transform: scale(1.8) rotate(10deg); }
            70% { transform: scale(1.5) rotate(-5deg); }
            100% { transform: scale(4) rotate(-30deg); opacity: 0; }
        }
        /* ========== RESPONSIVE ========== */
        @media (max-width: 700px) {
            .gifts-header { padding: 20px; flex-direction: column; text-align: center; }
            .gifts-header h1 { font-size: 24px; }
            .header-right { width: 100%; justify-content: center; }
            .gifts-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .gift-card { padding: 18px 12px; }
            .gift-icon { font-size: 45px; }
            .gift-name { font-size: 14px; min-height: 35px; }
            .balance-display .amount { font-size: 20px; }
            .buy-points-btn { padding: 12px 20px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">📘 SocialWiki</a>
        </div>
        <ul class="nav-icons">
            <li><a href="index.html">🏠</a></li>
            <li><a href="friends.html">👥</a></li>
            <li><a href="market-plus.html">🛍️</a></li>
            <li><a href="events.html">📅</a></li>
            <li><a href="notifications.html">🔔</a></li>
        </ul>
       <div class="nav-right">
    <a href="profile.html" class="nav-profile">
        <img src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" id="navProfileImg" alt="Profile">
        <span id="navProfileName">User</span>
    </a>
    <div class="language-selector">
        <button class="language-btn" onclick="toggleLanguageMenu()">🌐</button>
        <div class="language-menu" id="languageMenu" style="max-height: 400px; overflow-y: auto;">
            <button onclick="changeLanguage('ar')">🇲🇦 العربية</button>
            <button onclick="changeLanguage('fr')">🇫🇷 Français</button>
            <button onclick="changeLanguage('en')">🇬🇧 English</button>
            <button onclick="changeLanguage('es')">🇪🇸 Español</button>
            <button onclick="changeLanguage('de')">🇩🇪 Deutsch</button>
            <button onclick="changeLanguage('it')">🇮🇹 Italiano</button>
            <button onclick="changeLanguage('ja')">🇯🇵 日本語</button>
            <button onclick="changeLanguage('zh')">🇨🇳 中文</button>
            <button onclick="changeLanguage('ko')">🇰🇷 한국어</button>
            <button onclick="changeLanguage('ru')">🇷🇺 Русский</button>
            <button onclick="changeLanguage('tr')">🇹🇷 Türkçe</button>
            <button onclick="changeLanguage('hi')">🇮🇳 हिन्दी</button>
            <button onclick="changeLanguage('fil')">🇵🇭 Filipino</button>
            <button onclick="changeLanguage('tl')">🇵🇭 Tagalog</button>
        </div>
    </div>
    <button class="logout-button" onclick="logout()" data-i18n="logout">Logout</button>
</div>
    </nav>

    <div class="nav-buttons">
        <a href="index.html" class="home-btn" data-i18n="home_btn">🏠 Home</a>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="gifts-container">

        <!-- HEADER -->
        <div class="gifts-header">
            <div>
                <h1>🎁 <span data-i18n="gifts_title">Gifts</span></h1>
                <p data-i18n="gifts_subtitle">Send gifts to your friends and make them happy</p>
            </div>
                      <div class="header-right">
                <!-- Real Points -->
                <div class="balance-display">
                    <span class="icon">🪙</span>
                    <div>
                        <div class="amount" id="myBalance">0</div>
                        <div class="label" data-i18n="real_points">Real Points</div>
                    </div>
                </div>

                <!-- Gift Points (جديد) -->
                <div class="balance-display" style="background: linear-gradient(135deg, #ffd700, #f7b928);">
                    <span class="icon">🎁</span>
                    <div>
                        <div class="amount" id="myGiftPoints" style="color: #333;">0</div>
                        <div class="label" style="color: #333;" data-i18n="gift_points">Gift Points</div>
                    </div>
                </div>

                <!-- Buy Points -->
                <a href="buy-points.html" class="buy-points-btn">
                    💰 <span data-i18n="buy_points">Buy Points</span>
                </a>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <button class="filter-btn active" onclick="filterGifts('all', this)">
                ✨ <span data-i18n="all_gifts">All</span>
            </button>
            <button class="filter-btn free" onclick="filterGifts('free', this)">
                🆓 <span data-i18n="free_gifts">Free</span>
            </button>
            <button class="filter-btn" onclick="filterGifts('small', this)">
                🥉 <span data-i18n="small_gifts">Small</span>
            </button>
            <button class="filter-btn" onclick="filterGifts('medium', this)">
                🥈 <span data-i18n="medium_gifts">Medium</span>
            </button>
            <button class="filter-btn" onclick="filterGifts('big', this)">
                🥇 <span data-i18n="big_gifts">Big</span>
            </button>
            <button class="filter-btn" onclick="filterGifts('premium', this)">
                👑 <span data-i18n="premium_gifts">Premium</span>
            </button>
            <button class="filter-btn legendary" onclick="filterGifts('legendary', this)">
                💎 <span data-i18n="legendary_gifts">Legendary</span>
            </button>
        </div>

        <!-- GIFTS GRID -->
        <div class="gifts-grid" id="giftsGrid">
            <div class="loading-spinner">⏳ <span data-i18n="loading">Loading...</span></div>
        </div>

    </div>

    <!-- SEND GIFT MODAL -->
    <div id="sendGiftModal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">🎁 <span data-i18n="send_gift_title">Send Gift</span></h3>
                <button class="modal-close" onclick="closeSendModal()">✕</button>
            </div>

            <div class="gift-preview" id="giftPreview">
                <div class="icon" id="previewIcon">🎁</div>
                <div class="name" id="previewName">Gift</div>
                <div class="cost" id="previewCost">0 points</div>
            </div>

            <div class="form-group">
                <label data-i18n="select_friend">👥 Select Friend</label>
                <select id="receiverSelect">
                    <option value="" data-i18n="loading_friends">Loading friends...</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="message_optional">💬 Message (Optional)</label>
                <textarea id="giftMessage" placeholder="Write a nice message..." data-i18n-placeholder="gift_message_placeholder"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSendModal()" data-i18n="cancel">Cancel</button>
                <button class="btn-send" id="sendGiftBtn" onclick="sendGift()" data-i18n="send_gift_btn">
                    🎁 Send Gift
                </button>
            </div>
        </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js?v=999999"></script>
    <script>
        // =========================================================
        // SUPABASE
        // =========================================================
        const SUPABASE_URL = "https://hvslktufqrgdgrgxmvcm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

             let currentUser = null;
        let allGifts = [];
        let selectedGift = null;
        let currentBalance = 0;
        let currentGiftPoints = 0;  // ✅ جديد

        // =========================================================
        // LOGOUT
        // =========================================================
        function logout() {
            supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        }

        // =========================================================
        // LOAD USER
        // =========================================================
                // =========================================================
        // LOAD USER
        // =========================================================
        async function loadUser() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }
            currentUser = user;

            // جلب بيانات البروفايل
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('username, full_name, avatar_url')
                .eq('id', user.id)
                .single();

            // جلب الرصيد (نقاط حقيقية + نقاط هدايا)
            const { data: balance } = await supabaseClient
                .from('user_balances')
                .select('available_points, gift_points')
                .eq('user_id', user.id)
                .maybeSingle();

            const name = profile?.full_name || profile?.username || 'User';
            const avatar = profile?.avatar_url || `https://ui-avatars.com/api/?name=${name}&background=1877f2&color=fff`;
            
            currentBalance = balance?.available_points || 0;
            currentGiftPoints = balance?.gift_points || 0;

            // تحديث Navbar
            document.getElementById('navProfileName').textContent = name;
            document.getElementById('navProfileImg').src = avatar;

            // تحديث عرض الرصيد
            const balanceEl = document.getElementById('myBalance');
            if (balanceEl) balanceEl.textContent = currentBalance.toLocaleString();

            const giftPointsEl = document.getElementById('myGiftPoints');
            if (giftPointsEl) giftPointsEl.textContent = currentGiftPoints.toLocaleString();

                      return { currentBalance, currentGiftPoints };
        }

        // =========================================================
        // LOAD GIFTS
        // =========================================================
        async function loadGifts() {
            const grid = document.getElementById('giftsGrid');

            try {
                const { data: gifts, error } = await supabaseClient
                    .from('gifts')
                    .select('*')
                    .eq('is_active', true)
                    .order('display_order', { ascending: true });

                if (error) {
                    console.error('❌ Error:', error);
                    grid.innerHTML = '<div class="empty-state">❌ Failed to load gifts</div>';
                    return;
                }

                if (!gifts || gifts.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎁</div><p>No gifts available</p></div>';
                    return;
                }

                allGifts = gifts;
                renderGifts(gifts);

            } catch (error) {
                console.error('❌ Fatal:', error);
                grid.innerHTML = '<div class="empty-state">❌ Error</div>';
            }
        }

        // =========================================================
        // RENDER GIFTS
        // =========================================================
        function renderGifts(gifts) {
            const grid = document.getElementById('giftsGrid');
            grid.innerHTML = '';

            gifts.forEach(gift => {
                const category = gift.category || 'small';
                const isFree = gift.cost_points === 0 || category === 'free';
                
                const categoryLabels = {
                    free: '🆓',
                    small: '🥉',
                    medium: '🥈',
                    big: '🥇',
                    premium: '👑',
                    legendary: '💎'
                };

                const card = document.createElement('div');
                card.className = 'gift-card';
                card.setAttribute('data-category', category);
                card.onclick = () => openSendModal(gift);
                
                card.innerHTML = `
                    ${isFree ? '<span class="free-label">FREE</span>' : ''}
                    <span class="gift-category-badge ${category}">${categoryLabels[category] || ''}</span>
                    <div class="gift-icon">${gift.icon}</div>
                    <div class="gift-name">${gift.name_ar || gift.name_en}</div>
                    <div class="gift-cost ${isFree ? 'free-cost' : ''}">
                        <span>${isFree ? '🆓' : '🪙'}</span>
                        <span>${isFree ? 'FREE' : gift.cost_points}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // =========================================================
        // FILTER GIFTS
        // =========================================================
        function filterGifts(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            let filtered = allGifts;
            if (category !== 'all') {
                filtered = allGifts.filter(g => g.category === category);
            }

            if (filtered.length === 0) {
                document.getElementById('giftsGrid').innerHTML = 
                    '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>No gifts in this category</p></div>';
            } else {
                renderGifts(filtered);
            }
        }

        // =========================================================
        // OPEN SEND MODAL
        // =========================================================
        async function openSendModal(gift) {
            selectedGift = gift;
            const isFree = gift.cost_points === 0 || gift.category === 'free';

            document.getElementById('previewIcon').textContent = gift.icon;
            document.getElementById('previewName').textContent = gift.name_ar || gift.name_en;
            
            const costEl = document.getElementById('previewCost');
            if (isFree) {
                costEl.textContent = '🆓 FREE';
                costEl.className = 'cost free-cost';
            } else {
                costEl.textContent = `🪙 ${gift.cost_points} points`;
                costEl.className = 'cost';
            }

            const previewEl = document.getElementById('giftPreview');
            previewEl.className = 'gift-preview';
            if (isFree) previewEl.classList.add('free-preview');
            if (gift.category === 'legendary') previewEl.classList.add('legendary-preview');

            const sendBtn = document.getElementById('sendGiftBtn');
            sendBtn.className = isFree ? 'btn-send free-send' : 'btn-send';

            await loadFriendsList();
            document.getElementById('sendGiftModal').classList.add('show');
        }

        function closeSendModal() {
            document.getElementById('sendGiftModal').classList.remove('show');
            document.getElementById('giftMessage').value = '';
            selectedGift = null;
        }

        // =========================================================
        // LOAD FRIENDS LIST
        // =========================================================
        async function loadFriendsList() {
            const select = document.getElementById('receiverSelect');
            select.innerHTML = '<option value="">Loading...</option>';

            try {
                const { data: users, error } = await supabaseClient
                    .from('profiles')
                    .select('id, username, full_name')
                    .neq('id', currentUser.id)
                    .limit(100);

                if (error) throw error;

                select.innerHTML = '<option value="">-- Select a friend --</option>';

                if (!users || users.length === 0) {
                    select.innerHTML = '<option value="">No users available</option>';
                    return;
                }

                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.textContent = user.full_name || user.username || 'User';
                    select.appendChild(option);
                });

            } catch (error) {
                console.error('❌ Friends error:', error);
                select.innerHTML = '<option value="">Error loading friends</option>';
            }
        }

        // =========================================================
        // SEND GIFT
        // =========================================================
        async function sendGift() {
            const receiverId = document.getElementById('receiverSelect').value;
            const message = document.getElementById('giftMessage').value.trim();
            const btn = document.getElementById('sendGiftBtn');

            if (!receiverId) {
                showToast('⚠️ Please select a friend', 'error');
                return;
            }

            if (!selectedGift) {
                showToast('⚠️ No gift selected', 'error');
                return;
            }

            const isFree = selectedGift.cost_points === 0 || selectedGift.category === 'free';

            if (!isFree && currentBalance < selectedGift.cost_points) {
                showToast(`❌ You need ${selectedGift.cost_points} points. You have ${currentBalance}.`, 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Sending...';

            try {
                const { data, error } = await supabaseClient.rpc('send_gift', {
                    p_sender_id: currentUser.id,
                    p_receiver_id: receiverId,
                    p_gift_id: selectedGift.id,
                    p_message: message || null
                });

                if (error) {
                    console.error('❌ Send error:', error);
                    showToast('❌ Error: ' + error.message, 'error');
                    return;
                }

                if (!data.success) {
                    showToast('❌ ' + data.error, 'error');
                    return;
                }

                // نجاح!
                showGiftAnimation(selectedGift);
                showToast(`🎉 Gift sent! ${data.gift_icon} ${data.gift_name}`, 'success');

                // تحديث الرصيد
                currentBalance = data.new_balance;
                document.getElementById('myBalance').textContent = currentBalance.toLocaleString();

                closeSendModal();

            } catch (error) {
                console.error('❌ Fatal:', error);
                showToast('❌ Error: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎁 Send Gift';
            }
        }

        // =========================================================
        // FULL SCREEN GIFT ANIMATION
        // =========================================================
            // =========================================================
        // 🎵 GIFT SOUNDS MAP
        // =========================================================
        const giftSounds = {
            '🦁': 'sounds/sound-lion.mp3',
            '🐉': 'sounds/voice-dragon.mp3',
            '🚀': 'sounds/sound-rocket.mp3',
            '✈️': 'sounds/sound-rocket.mp3',
            '🏆': 'sounds/voice-waw.mp3',
            '👑': 'sounds/voice-waw.mp3',
            '🦄': 'sounds/voice-waw.mp3',
            '🚗': 'sounds/voice-waw.mp3',
            '🏍️': 'sounds/voice-waw.mp3',
            '💎': 'sounds/voice-waw.mp3',
            '💍': 'sounds/voice-waw.mp3',
            '🛥️': 'sounds/voice-waw.mp3',
            '🏰': 'sounds/voice-waw.mp3',
            'default': 'sounds/voice-waw.mp3'
        };

        // =========================================================
        // 🎵 PLAY GIFT SOUND
        // =========================================================
        function playGiftSound(giftIcon) {
            const soundUrl = giftSounds[giftIcon] || giftSounds['default'];
            try {
                const audio = new Audio(soundUrl);
                audio.volume = 0.7;
                audio.play().catch(e => console.log('🔇 Audio blocked:', e.message));
            } catch (e) {
                console.log('🔇 Sound error:', e);
            }
        }

        // =========================================================
        // 🎉 CREATE CONFETTI
        // =========================================================
        function createConfetti(count = 50) {
            const colors = ['#ffd700', '#ff6b6b', '#4facfe', '#a855f7', '#28a745', '#ec4899'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                    confetti.style.width = (8 + Math.random() * 12) + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';

                    document.querySelector('.gift-animation')?.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }

        // =========================================================
        // 🎬 FULL SCREEN GIFT ANIMATION (TikTok style)
        // =========================================================
        function showGiftAnimation(gift) {
            // 1. تشغيل الصوت
            playGiftSound(gift.icon);

            // 2. تحديد نوع الهدية
            const isLegendary = gift.category === 'legendary';
            const isPremium = gift.category === 'premium';
            const isBig = gift.category === 'big';

            // 3. إنشاء عنصر الأنيميشن
            const anim = document.createElement('div');
            anim.className = 'gift-animation';
            if (isLegendary) anim.classList.add('legendary-anim');

            anim.innerHTML = `
                <div class="emoji">${gift.icon}</div>
                <div class="gift-label">${gift.name_ar || gift.name_en}</div>
            `;

            document.body.appendChild(anim);

            // 4. Confetti للهدايا الكبيرة والأسطورية
            if (isLegendary) {
                createConfetti(100);
                setTimeout(() => createConfetti(50), 500);
                setTimeout(() => createConfetti(50), 1000);
            } else if (isPremium || isBig) {
                createConfetti(60);
            } else if (gift.cost_points > 0) {
                createConfetti(20);
            }

            // 5. إزالة بعد 4 ثواني
            setTimeout(() => anim.remove(), 4000);
        }

        // =========================================================
        // TOAST
        // =========================================================
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.innerHTML = `
                <span class="toast-icon">${type === 'success' ? '✅' : '❌'}</span>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // =========================================================
        // INIT
        // =========================================================
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🎁 gifts.html loaded');

           if (typeof getCurrentLanguage === 'function' && typeof setLanguage === 'function') {
    try {
        setLanguage(getCurrentLanguage());
    } catch (e) {
        console.warn('⚠️ setLanguage failed:', e);
    }
}

            await loadUser();
            await loadGifts();

            document.getElementById('sendGiftModal').addEventListener('click', function(e) {
                if (e.target === this) closeSendModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeSendModal();
            });
        });

        // Make global
        window.logout = logout;
        window.filterGifts = filterGifts;
        window.openSendModal = openSendModal;
        window.closeSendModal = closeSendModal;
        window.sendGift = sendGift;
        // =========================================================
// LANGUAGE SELECTOR
// =========================================================
window.toggleLanguageMenu = function() {
    const menu = document.getElementById('languageMenu');
    if (menu) menu.classList.toggle('show');
};

window.changeLanguage = function(lang) {
    if (typeof setLanguage === 'function') {
        setLanguage(lang);
    } else if (typeof applyTranslations === 'function') {
        applyTranslations(lang);
    }
    const menu = document.getElementById('languageMenu');
    if (menu) menu.classList.remove('show');
    localStorage.setItem('preferredLanguage', lang);
};

// إغلاق القائمة عند الضغط خارجها
document.addEventListener('click', function(e) {
    const selector = document.querySelector('.language-selector');
    const menu = document.getElementById('languageMenu');
    if (selector && menu && !selector.contains(e.target)) {
        menu.classList.remove('show');
    }
});

// تحميل اللغة المحفوظة عند فتح الصفحة
// تحميل اللغة المحفوظة عند فتح الصفحة
document.addEventListener('DOMContentLoaded', function() {
    const savedLang = localStorage.getItem('preferredLanguage');
    if (savedLang && typeof setLanguage === 'function') {
        setLanguage(savedLang);
    } else if (typeof getCurrentLanguage === 'function' && typeof setLanguage === 'function') {
        setLanguage(getCurrentLanguage());
    }
});
    </script>
