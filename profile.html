    <script>
        // =========================================================
        // SUPABASE SETUP
        // =========================================================
        const SUPABASE_URL = "https://hvslktufqrgdgrgxmvcm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";

        // =========================================================
        // DRAG & ZOOM
        // =========================================================
        function enableDragZoom(containerId, imgId) {
            const container = document.getElementById(containerId);
            const img = document.getElementById(imgId);
            
            if (!container || !img) return;
            
            let isDragging = false;
            let startX, startY;
            let translateX = 0, translateY = 0;
            let scale = 1;
            let startScale = 1;
            let startDistance = 0;
            
            container.addEventListener('wheel', function(e) {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                scale = Math.min(Math.max(1, scale + delta), 3);
                img.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
            });
            
            container.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                container.style.cursor = 'grabbing';
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                img.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
            });
            
            document.addEventListener('mouseup', function() {
                isDragging = false;
                container.style.cursor = 'move';
            });
            
            container.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - translateX;
                    startY = e.touches[0].clientY - translateY;
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    startDistance = Math.sqrt(dx * dx + dy * dy);
                    startScale = scale;
                }
            });
            
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && isDragging) {
                    translateX = e.touches[0].clientX - startX;
                    translateY = e.touches[0].clientY - startY;
                    img.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    scale = Math.min(Math.max(1, startScale * (distance / startDistance)), 3);
                    img.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
                }
            });
            
            document.addEventListener('touchend', function() {
                isDragging = false;
            });
        }

        // =========================================================
// ✅ التحقق من الشارات الجديدة وإرسال إشعار
// =========================================================
async function checkForNewBadges(userId, badges) {
    if (!badges || badges.length === 0) return;
    
    try {
        // جلب الشارات التي شاهدها المستخدم سابقاً
        const { data: seenBadges, error } = await supabaseClient
            .from('user_badge_notifications')
            .select('badge_country')
            .eq('user_id', userId);
        
        if (error) {
            console.error('Error fetching seen badges:', error);
            return;
        }
        
        const seenCountries = (seenBadges || []).map(b => b.badge_country);
        
        // البحث عن شارات جديدة
        for (const badge of badges) {
            if (!seenCountries.includes(badge.country)) {
                // إرسال إشعار
                await sendBadgeNotification(userId, badge);
                
                // تسجيل الشارة كمشاهدة
                await supabaseClient
                    .from('user_badge_notifications')
                    .insert({
                        user_id: userId,
                        badge_country: badge.country,
                        is_read: false
                    });
            }
        }
    } catch (err) {
        console.error('Error checking badges:', err);
    }
}

        function changeAvatar() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = async function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    if (!user) { alert('Please login first!'); return; }
                    
                    const fileName = `avatars/${user.id}/${Date.now()}_${file.name}`;
                    const { error: uploadError } = await supabaseClient.storage
                        .from('avatars')
                        .upload(fileName, file);
                    
                    if (uploadError) {
                        console.error('Upload error:', uploadError);
                        alert('Error uploading: ' + uploadError.message);
                        return;
                    }
                    
                    const { data: urlData } = supabaseClient.storage
                        .from('avatars')
                        .getPublicUrl(fileName);
                    
                    const avatarUrl = urlData.publicUrl;
                    
                    await supabaseClient
                        .from('profiles')
                        .update({ avatar_url: avatarUrl })
                        .eq('id', user.id);
                    
                    document.getElementById('avatarImg').src = avatarUrl;
                    document.getElementById('navProfileImg').src = avatarUrl;
                    
                    alert('✅ Profile picture updated!');
                    
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error: ' + error.message);
                }
            };
            input.click();
        }

      async function updateProfile(updates) {
    try {
        // احصل على المستخدم أولاً
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) {
            alert("Please login first!");
            window.location.href = "auth.html";
            return;
        }
        
        // تحقق من username
        if (updates.username) {
            const forbiddenNames = ['admin', 'owner', 'super_admin', 'administrator', 'moderator'];
            if (forbiddenNames.includes(updates.username.toLowerCase())) {
                alert('This username is not allowed!');
                return;
            }
        }
        
        // حدّث البيانات
        const { error } = await supabaseClient
            .from("profiles")
            .update(updates)
            .eq("id", user.id);
        
        if (error) {
            console.error("Error updating profile:", error);
            alert("Error updating profile: " + error.message);
            return;
        }
        
        // ✅ إكمال مهمة "Complete Profile"
        if (typeof verifyAndCompleteTask === 'function') {
            verifyAndCompleteTask('complete_profile');
        }
        
        alert("✅ Profile updated successfully!");
        window.location.reload();
        
    } catch (error) {
        console.error("Error:", error);
        alert("An error occurred: " + error.message);
    }
}

        // =========================================================
        // FORMAT TIME
        // =========================================================
        function formatTimeAgo(timestamp) {
            if (!timestamp) return 'Just now';
            
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            
            const minutes = Math.floor(diff / 60000);
            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes} min ago`;
            
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} hr ago`;
            
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} days ago`;
            
            return date.toLocaleDateString();
        }
        
        // =========================================================
        // ESCAPE HTML
        // =========================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // =========================================================
        // FRIEND SYSTEM
        // =========================================================
        async function checkFriendshipStatus() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                
                currentUserId = user.id;
                
                const addBtn = document.getElementById('addFriendBtn');
                const sentBtn = document.getElementById('requestSentBtn');
                const actionsBtn = document.getElementById('friendActionsBtn');
                const editBtn = document.querySelector('.edit-btn');
                const messageBtn = document.querySelector('.message-btn');
                
                if (!addBtn || !sentBtn || !actionsBtn) return;
                
                // إذا كنت في صفحتك → أخفِ أزرار الصداقة وأظهر Edit
                if (profileUserId === currentUserId) {
                    addBtn.style.display = 'none';
                    sentBtn.style.display = 'none';
                    actionsBtn.style.display = 'none';
                    if (editBtn) editBtn.style.display = 'inline-flex';
                    if (messageBtn) messageBtn.style.display = 'none';
                    return;
                }
                
                // إذا كنت في صفحة شخص آخر → أخفِ Edit وأظهر Message
                if (editBtn) editBtn.style.display = 'none';
                if (messageBtn) messageBtn.style.display = 'inline-flex';
                
                // 1. هل هم أصدقاء بالفعل؟
                const { data: friend } = await supabaseClient
                    .from('friends')
                    .select('id')
                    .eq('user_id', currentUserId)
                    .eq('friend_id', profileUserId)
                    .maybeSingle();
                
                if (friend) {
                    addBtn.style.display = 'none';
                    sentBtn.style.display = 'none';
                    actionsBtn.style.display = 'inline-flex';
                    return;
                }
                
                // 2. هل هناك طلب معلّق؟
                const { data: request } = await supabaseClient
                    .from('friend_requests')
                    .select('id, sender_id')
                    .or(`and(sender_id.eq.${currentUserId},receiver_id.eq.${profileUserId}),and(sender_id.eq.${profileUserId},receiver_id.eq.${currentUserId})`)
                    .eq('status', 'pending')
                    .maybeSingle();
                
                if (request) {
                    if (request.sender_id === currentUserId) {
                        addBtn.style.display = 'none';
                        sentBtn.style.display = 'inline-flex';
                        actionsBtn.style.display = 'none';
                    } else {
                        addBtn.style.display = 'none';
                        sentBtn.style.display = 'none';
                        actionsBtn.style.display = 'none';
                        showFriendRequestActions(request.id);
                    }
                    return;
                }
                
                // 3. لا شيء → "Add Friend"
                addBtn.style.display = 'inline-flex';
                sentBtn.style.display = 'none';
                actionsBtn.style.display = 'none';
                
            } catch (error) {
                console.error('Error checking friendship:', error);
            }
        }
        
        // إرسال طلب صداقة
        async function sendFriendRequest() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    alert('Please login first');
                    return;
                }
                
                if (!profileUserId || profileUserId === user.id) return;
                
                const { error } = await supabaseClient
                    .from('friend_requests')
                    .insert({
                        sender_id: user.id,
                        receiver_id: profileUserId,
                        status: 'pending'
                    });
                
                if (error) {
                    if (error.code === '23505') {
                        alert('You already sent a request');
                    } else {
                        alert('Error: ' + error.message);
                    }
                    return;
                }
                
                // إرسال إشعار
                const { data: senderProfile } = await supabaseClient
                    .from('profiles')
                    .select('username, full_name')
                    .eq('id', user.id)
                    .single();
                
                const senderName = senderProfile?.full_name || senderProfile?.username || 'Someone';
                
                await supabaseClient
                    .from('notifications')
                    .insert({
                        receiver_id: profileUserId,
                        sender_id: user.id,
                        type: 'friend_request',
                        message: `👥 ${senderName} sent you a friend request`,
                        is_read: false
                    });
                
                alert('✅ Friend request sent!');
                
                document.getElementById('addFriendBtn').style.display = 'none';
                document.getElementById('requestSentBtn').style.display = 'inline-flex';
                
            } catch (error) {
                console.error('Error sending request:', error);
                alert('Error: ' + error.message);
            }
        }
        
        // عرض أزرار Accept / Reject
        function showFriendRequestActions(requestId) {
            const actionsDiv = document.querySelector('.profile-actions');
            if (!actionsDiv) return;
            
            document.getElementById('acceptBtn')?.remove();
            document.getElementById('rejectBtn')?.remove();
            
            const acceptBtn = document.createElement('button');
            acceptBtn.id = 'acceptBtn';
            acceptBtn.textContent = '✅ Accept';
            acceptBtn.style.background = '#28a745';
            acceptBtn.style.color = 'white';
            acceptBtn.onclick = () => acceptFriendRequest(requestId);
            
            const rejectBtn = document.createElement('button');
            rejectBtn.id = 'rejectBtn';
            rejectBtn.textContent = '❌ Reject';
            rejectBtn.style.background = '#dc3545';
            rejectBtn.style.color = 'white';
            rejectBtn.onclick = () => rejectFriendRequest(requestId);
            
            actionsDiv.insertBefore(acceptBtn, actionsDiv.firstChild);
            actionsDiv.insertBefore(rejectBtn, acceptBtn.nextSibling);
        }
        
        // قبول طلب
        async function acceptFriendRequest(requestId) {
            try {
                const { error } = await supabaseClient.rpc('accept_friend_request', {
                    p_request_id: requestId
                });
                
                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }
                
                alert('✅ Friend request accepted!');
                window.location.reload();
                
            } catch (error) {
                console.error('Error accepting request:', error);
                alert('Error: ' + error.message);
            }
        }
        
        // رفض طلب
        async function rejectFriendRequest(requestId) {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                const { error } = await supabaseClient
                    .from('friend_requests')
                    .update({ status: 'rejected', updated_at: new Date() })
                    .eq('id', requestId)
                    .eq('receiver_id', user.id);
                
                if (error) {
                    alert('Error: ' + error.message);
                    return;
                }
                
                alert('❌ Friend request rejected');
                window.location.reload();
                
            } catch (error) {
                console.error('Error rejecting:', error);
            }
        }
