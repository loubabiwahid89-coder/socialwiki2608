<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حظلة الفواكه - Wikidoogo</title>
    <link rel="stylesheet" href="socialwiki.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <style>
        /* ========== تنسيقات صفحة اللعبة ========== */
        body {
            background: #1a1a2e; /* خلفية داكنة للعبة */
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* شريط التنقل (نفس تصميم موقعك) */
        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            background: #1877f2; padding: 0 16px; height: 56px;
            position: sticky; top: 0; z-index: 1000; width: 100%;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .logo { color: white; font-size: 24px; font-weight: 800; text-decoration: none; }
        .nav-icons { display: flex; align-items: center; gap: 8px; list-style: none; margin: 0; padding: 0; }
        .nav-icons a { color: white; font-size: 20px; text-decoration: none; padding: 8px; border-radius: 50%; }
        .nav-icons a:hover { background: rgba(255,255,255,0.2); }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-profile { display: flex; align-items: center; gap: 8px; color: white; text-decoration: none; padding: 5px 10px; border-radius: 50px; }
        .nav-profile img { width: 32px; height: 32px; border-radius: 50%; }
        .logout-button { background: rgba(255,255,255,0.2); border: none; padding: 8px 16px; border-radius: 20px; color: white; cursor: pointer; font-size: 14px; }

        /* حاوية اللعبة */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
        }

        .balance-bar {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px solid #ffd700;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 20px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ffd700;
            z-index: 10;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        .bet-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .bet-btn {
            background: #16213e;
            border: 2px solid #0f3460;
            color: white;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .bet-btn:hover {
            background: #0f3460;
            border-color: #ffd700;
        }

        .bet-btn.active {
            border-color: #ffd700;
            background: #0f3460;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .bet-btn span.emoji {
            font-size: 30px;
        }

        .amount-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .amount-btn {
            background: #533483;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .amount-btn:hover, .amount-btn.active {
            background: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .spin-btn {
            background: linear-gradient(135deg, #e94560, #533483);
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
            transition: 0.2s;
            width: 100%;
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-message {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
        }

        .win { color: #4ade80; }
        .lose { color: #f87171; }

        .leaderboard {
            width: 100%;
            background: #16213e;
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
        }
        .leaderboard h3 {
            text-align: center;
            color: #ffd700;
            margin-top: 0;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #0f3460;
        }
    </style>
</head>
<body>

    <!-- شريط التنقل (Navbar) -->
    <nav class="navbar">
        <div class="nav-left"><a href="index.html" class="logo">📘 Wikidoogo</a></div>
        <ul class="nav-icons">
            <li><a href="index.html">🏠</a></li>
            <li><a href="friends.html">👥</a></li>
            <li><a href="market-plus.html">🛍️</a></li>
            <li><a href="events.html">📅</a></li>
            <li><a href="notifications.html">🔔</a></li>
        </ul>
        <div class="nav-right">
            <a href="profile.html" class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" id="navProfileImg" alt="Profile">
                <span id="navProfileName">User</span>
            </a>
            <button class="logout-button" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- منطقة اللعب -->
    <div class="game-area">
        
        <!-- شريط الرصيد -->
        <div class="balance-bar">
            💎 الرصيد: <span id="balanceDisplay">1000</span>
        </div>

        <!-- العجلة -->
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>

        <!-- اختيار العنصر (رهان) -->
        <div class="bet-options" id="betOptions">
            <div class="bet-btn" data-value="watermelon" onclick="selectBet('watermelon', this)">
                <span class="emoji">🍉</span> بطيخ (x2)
            </div>
            <div class="bet-btn" data-value="grapes" onclick="selectBet('grapes', this)">
                <span class="emoji">🍇</span> عنب (x2)
            </div>
            <div class="bet-btn" data-value="77" onclick="selectBet('77', this)">
                <span class="emoji">7️⃣7️⃣</span> 77 (x8)
            </div>
            <div class="bet-btn" data-value="apple" onclick="selectBet('apple', this)">
                <span class="emoji">🍎</span> تفاح (x2)
            </div>
        </div>

        <!-- اختيار المبلغ -->
        <div class="amount-options">
            <button class="amount-btn active" onclick="setBetAmount(50, this)">50</button>
            <button class="amount-btn" onclick="setBetAmount(100, this)">100</button>
            <button class="amount-btn" onclick="setBetAmount(500, this)">500</button>
        </div>

        <!-- زر الدوران -->
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()" disabled>🎡 قم بالدوران</button>

        <!-- رسالة النتيجة -->
        <div class="result-message" id="resultMessage"></div>

        <!-- المتصدرون -->
        <div class="leaderboard">
            <h3>🏆 المتصدرون (اليوم)</h3>
            <div id="leaderboardList">
                <div class="lb-item"><span>1. Player1</span> <span>5000</span></div>
                <div class="lb-item"><span>2. Player2</span> <span>3000</span></div>
                <div class="lb-item"><span>3. Player3</span> <span>1500</span></div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // إعدادات اللعبة
        // ==========================================
        let balance = 1000;
        let currentBetAmount = 50;
        let selectedBet = null;
        let isSpinning = false;

        const segments = [
            { label: 'بطيخ', color: '#2ecc71', value: 'watermelon', multiplier: 2 },
            { label: 'عنب', color: '#8e44ad', value: 'grapes', multiplier: 2 },
            { label: '77', color: '#f1c40f', value: '77', multiplier: 8 },
            { label: 'تفاح', color: '#e74c3c', value: 'apple', multiplier: 2 },
            { label: 'بطيخ', color: '#2ecc71', value: 'watermelon', multiplier: 2 },
            { label: 'عنب', color: '#8e44ad', value: 'grapes', multiplier: 2 },
            { label: '77', color: '#f1c40f', value: '77', multiplier: 8 },
            { label: 'تفاح', color: '#e74c3c', value: 'apple', multiplier: 2 }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const resultMessage = document.getElementById('resultMessage');

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const anglePerSegment = (2 * Math.PI) / segments.length;

            segments.forEach((segment, index) => {
                const startAngle = index * anglePerSegment;
                const endAngle = startAngle + anglePerSegment;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = segment.color;
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.font = "bold 20px Arial";
                ctx.fillText(segment.label, radius - 30, 10);
                ctx.restore();
            });
        }

        function selectBet(value, element) {
            if (isSpinning) return;
            selectedBet = value;
            document.querySelectorAll('.bet-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            spinBtn.disabled = false;
        }

        function setBetAmount(amount, element) {
            if (isSpinning) return;
            if (amount > balance) {
                alert("رصيدك غير كافٍ!");
                return;
            }
            currentBetAmount = amount;
            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function spinWheel() {
            if (!selectedBet || isSpinning) return;
            if (balance < currentBetAmount) {
                alert("رصيدك غير كافٍ!");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            resultMessage.textContent = "";
            resultMessage.className = "result-message";

            balance -= currentBetAmount;
            updateBalance();

            const randomIndex = Math.floor(Math.random() * segments.length);
            const winningSegment = segments[randomIndex];

            const anglePerSegment = 360 / segments.length;
            const targetAngle = 360 * 5 + (360 - (randomIndex * anglePerSegment + anglePerSegment / 2));

            canvas.style.transform = `rotate(${targetAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                
                if (winningSegment.value === selectedBet) {
                    const winAmount = currentBetAmount * winningSegment.multiplier;
                    balance += winAmount;
                    updateBalance();
                    resultMessage.textContent = `🎉 مبروك! ربحت ${winAmount} نقطة (x${winningSegment.multiplier})`;
                    resultMessage.className = "result-message win";
                } else {
                    resultMessage.textContent = `😢 للأسف، خسرت ${currentBetAmount} نقطة. حاول مرة أخرى!`;
                    resultMessage.className = "result-message lose";
                }

                setTimeout(() => {
                    canvas.style.transition = 'none';
                    canvas.style.transform = `rotate(0deg)`;
                    setTimeout(() => {
                        canvas.style.transition = 'transform 3s cubic-bezier(0.25, 0.1, 0.25, 1)';
                    }, 50);
                }, 100);

            }, 3000);
        }

        function updateBalance() {
            balanceDisplay.textContent = balance;
        }

        // دالة تسجيل الخروج (موجودة في الكود الأصلي)
        function logout() {
            // هنا يمكنك إضافة كود تسجيل الخروج الخاص بـ Supabase
            window.location.href = "auth.html";
        }

        window.onload = () => {
            drawWheel();
            updateBalance();
        };
    </script>
</body>
</html>
