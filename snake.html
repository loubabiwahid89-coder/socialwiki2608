<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - SocialWiki</title>
    <link rel="stylesheet" href="socialwiki.css">
    <style>
        * { box-sizing: border-box; }
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0;
            color: #050505;
        }
        
        /* NAVBAR */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1877f2;
            padding: 0 16px;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; gap: 10px; }
        .logo { color: white; font-size: 24px; font-weight: 800; text-decoration: none; }
        .nav-icons {
            display: flex; align-items: center; gap: 8px;
            list-style: none; margin: 0; padding: 0;
        }
        .nav-icons a {
            color: white; font-size: 20px; text-decoration: none;
            padding: 8px; border-radius: 50%;
        }
        .nav-icons a:hover { background: rgba(255,255,255,0.2); }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-profile {
            display: flex; align-items: center; gap: 8px;
            color: white; text-decoration: none;
            padding: 5px 10px; border-radius: 50px;
        }
        .nav-profile img { width: 32px; height: 32px; border-radius: 50%; }
        .logout-button {
            background: rgba(255,255,255,0.2); border: none;
            padding: 8px 16px; border-radius: 20px;
            color: white; cursor: pointer; font-size: 14px;
        }
        
        /* BACK & HOME */
        .nav-buttons {
            padding: 10px 20px;
            background: #f0f2f5;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .nav-buttons a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        .back-btn {
            color: #65676b;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .home-btn {
            color: white;
            background: #1877f2;
        }
        
        /* GAME CONTAINER */
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        
        .game-header h1 {
            font-size: 36px;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-header p {
            color: #65676b;
            margin: 0 0 20px;
            font-size: 14px;
        }
        
        /* SCORE */
        .score-display {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .score-item {
            background: white;
            border-radius: 12px;
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            min-width: 120px;
        }
        .score-label {
            font-size: 13px;
            color: #65676b;
            margin-bottom: 5px;
        }
        .score-value {
            font-size: 24px;
            font-weight: 700;
            color: #1877f2;
        }
        .score-value.gold {
            color: #f7b928;
        }
        
        /* CANVAS */
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            background: white;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        #gameCanvas {
            display: block;
            border-radius: 12px;
            background: #1a1a2e;
            max-width: 100%;
            height: auto;
        }
        
        /* OVERLAY */
        .overlay {
            position: absolute;
            inset: 15px;
            background: rgba(0,0,0,0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
        .overlay.hidden { display: none; }
        .overlay h2 {
            font-size: 28px;
            margin: 0 0 15px;
        }
        .overlay p {
            font-size: 16px;
            margin: 0 0 20px;
            opacity: 0.9;
        }
        .overlay-btn {
            padding: 12px 30px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .overlay-btn:hover { background: #166fe5; }
        
        /* MOBILE CONTROLS */
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px);
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .mobile-btn {
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(24,119,242,0.3);
        }
        .mobile-btn:active {
            transform: scale(0.95);
            background: #166fe5;
        }
        .mobile-btn.up { grid-column: 2; grid-row: 1; }
        .mobile-btn.left { grid-column: 1; grid-row: 2; }
        .mobile-btn.down { grid-column: 2; grid-row: 2; }
        .mobile-btn.right { grid-column: 3; grid-row: 2; }
        
        /* CONTROLS */
        .game-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .control-btn {
            padding: 12px 24px;
            background: #1877f2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }
        .control-btn:hover { background: #166fe5; }
        .control-btn.secondary {
            background: #e4e6eb;
            color: #050505;
        }
        .control-btn.secondary:hover { background: #d4d6da; }
        
        @media (max-width: 700px) {
            .game-header h1 { font-size: 28px; }
            .mobile-controls { display: grid; }
            .score-item { padding: 10px 20px; min-width: 90px; }
            .score-value { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- BACK & HOME -->
    <div class="nav-buttons">
        <a href="gaming.html" class="back-btn" data-i18n="back">← Back</a>
        <a href="index.html" class="home-btn" data-i18n="home_btn">🏠 Home</a>
    </div>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">📘 SocialWiki</a>
        </div>
        <ul class="nav-icons">
            <li><a href="index.html">🏠</a></li>
            <li><a href="friends.html">👥</a></li>
            <li><a href="market-plus.html">🛍️</a></li>
            <li><a href="events.html">📅</a></li>
            <li><a href="notifications.html">🔔</a></li>
        </ul>
        <div class="nav-right">
            <a href="profile.html" class="nav-profile">
                <img src="https://ui-avatars.com/api/?name=User&background=1877f2&color=fff" id="navProfileImg" alt="Profile">
                <span id="navProfileName">User</span>
            </a>
            
            <!-- زر اللغة -->
            <div class="language-selector" style="position: relative;">
                <button id="languageButton" onclick="toggleLanguageMenu()" style="width: auto; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; font-size: 14px; padding: 0 15px;">🌐</button>
                <div class="language-menu" id="languageMenu" style="display: none; position: absolute; top: 45px; right: 0; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 9999; min-width: 180px; max-height: 400px; overflow-y: auto;">
                    <button onclick="changeLanguage('ar')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇲🇦 العربية</button>
                    <button onclick="changeLanguage('fr')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇫🇷 Français</button>
                    <button onclick="changeLanguage('en')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇬🇧 English</button>
                    <button onclick="changeLanguage('es')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇪🇸 Español</button>
                    <button onclick="changeLanguage('de')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇩🇪 Deutsch</button>
                    <button onclick="changeLanguage('it')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇮🇹 Italiano</button>
                    <button onclick="changeLanguage('ja')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇯🇵 日本語</button>
                    <button onclick="changeLanguage('zh')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇨🇳 中文</button>
                    <button onclick="changeLanguage('ko')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇰🇷 한국어</button>
                    <button onclick="changeLanguage('ru')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇷🇺 Русский</button>
                    <button onclick="changeLanguage('tr')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇹🇷 Türkçe</button>
                    <button onclick="changeLanguage('hi')" style="width: 100%; padding: 12px 15px; border: none; background: white; cursor: pointer; text-align: left; font-size: 14px;">🇮🇳 हिन्दी</button>
                </div>
            </div>
            
            <button class="logout-button" onclick="logout()" data-i18n="logout">Logout</button>
        </div>
    </nav>

    <!-- GAME CONTAINER -->
    <div class="game-container">
        
        <!-- HEADER -->
        <div class="game-header">
            <h1 data-i18n="snake_title">🐍 Snake Game</h1>
            <p data-i18n="snake_instructions">Use arrow keys to move</p>
        </div>

        <!-- SCORE -->
        <div class="score-display">
            <div class="score-item">
                <div class="score-label" data-i18n="score">Score</div>
                <div class="score-value" id="currentScore">0</div>
            </div>
            <div class="score-item">
                <div class="score-label" data-i18n="high_score">High Score</div>
                <div class="score-value gold" id="highScore">0</div>
            </div>
        </div>

        <!-- CANVAS -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <!-- OVERLAY (Start / Game Over) -->
            <div class="overlay" id="overlay">
                <h2 id="overlayTitle">🐍 Snake</h2>
                <p id="overlayText" data-i18n="snake_instructions">Use arrow keys to move</p>
                <button class="overlay-btn" id="overlayBtn" onclick="startGame()" data-i18n="start_game">Start Game</button>
            </div>
        </div>

        <!-- MOBILE CONTROLS -->
        <div class="mobile-controls">
            <button class="mobile-btn up" onclick="changeDirection('up')">▲</button>
            <button class="mobile-btn left" onclick="changeDirection('left')">◄</button>
            <button class="mobile-btn down" onclick="changeDirection('down')">▼</button>
            <button class="mobile-btn right" onclick="changeDirection('right')">►</button>
        </div>

        <!-- CONTROLS -->
        <div class="game-controls" style="margin-top: 20px;">
            <button class="control-btn" onclick="startGame()" data-i18n="play_again">🔄 Play Again</button>
        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/translations.js"></script>
    <script>
        const SUPABASE_URL = "https://hvslktufqrgdgrgxmvcm.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // =========================================================
        // GAME SETUP
        // =========================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20; // 20x20 grid
        const cellSize = canvas.width / gridSize; // 20px per cell

        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore') || '0');
        let gameLoop = null;
        let gameSpeed = 120; // ms
        let gameRunning = false;

        // =========================================================
        // LOGOUT
        // =========================================================
        function logout() {
            supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        }

        // =========================================================
        // LOAD USER PROFILE
        // =========================================================
        async function loadUserProfile() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) return;
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('username, full_name, avatar_url')
                    .eq('id', user.id)
                    .single();
                const username = profile?.username || profile?.full_name || 'User';
                const avatarUrl = profile?.avatar_url || `https://ui-avatars.com/api/?name=${username}&background=1877f2&color=fff`;
                document.getElementById('navProfileName').textContent = username;
                document.getElementById('navProfileImg').src = avatarUrl;
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // =========================================================
        // INITIALIZE GAME
        // =========================================================
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            document.getElementById('currentScore').textContent = '0';
            document.getElementById('highScore').textContent = highScore;
            generateFood();
        }

        // =========================================================
        // GENERATE FOOD
        // =========================================================
        function generateFood() {
            let newFood;
            let attempts = 0;
            do {
                newFood = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };
                attempts++;
            } while (snake.some(s => s.x === newFood.x && s.y === newFood.y) && attempts < 100);
            food = newFood;
        }

        // =========================================================
        // DRAW
        // =========================================================
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid (subtle)
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= gridSize; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#4facfe' : '#00f2fe';
                ctx.shadowColor = isHead ? '#4facfe' : 'transparent';
                ctx.shadowBlur = isHead ? 15 : 0;
                
                ctx.fillRect(
                    segment.x * cellSize + 1,
                    segment.y * cellSize + 1,
                    cellSize - 2,
                    cellSize - 2
                );

                // Eyes on head
                if (isHead) {
                    ctx.fillStyle = 'white';
                    ctx.shadowBlur = 0;
                    const eyeSize = 3;
                    const padding = 5;
                    if (direction === 'right' || direction === 'left') {
                        ctx.fillRect(segment.x * cellSize + padding, segment.y * cellSize + padding, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * cellSize + cellSize - padding - eyeSize, segment.y * cellSize + padding, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * cellSize + padding, segment.y * cellSize + padding, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * cellSize + padding, segment.y * cellSize + cellSize - padding - eyeSize, eyeSize, eyeSize);
                    }
                }
            });

            // Draw food (apple)
            ctx.fillStyle = '#f5576c';
            ctx.shadowColor = '#f5576c';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * cellSize + cellSize / 2,
                food.y * cellSize + cellSize / 2,
                cellSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            // Draw food highlight
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(
                food.x * cellSize + cellSize / 2 - 3,
                food.y * cellSize + cellSize / 2 - 3,
                cellSize / 6,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        // =========================================================
        // UPDATE GAME
        // =========================================================
        function update() {
            direction = nextDirection;

            const head = { ...snake[0] };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            // Check wall collision
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                gameOver();
                return;
            }

            // Check self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('currentScore').textContent = score;
                generateFood();
                
                // Increase speed every 50 points
                if (score % 50 === 0 && gameSpeed > 60) {
                    gameSpeed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameTick, gameSpeed);
                }
            } else {
                snake.pop();
            }
        }

        // =========================================================
        // GAME TICK
        // =========================================================
        function gameTick() {
            if (!gameRunning) return;
            update();
            draw();
        }

        // =========================================================
        // START GAME
        // =========================================================
        function startGame() {
            document.getElementById('overlay').classList.add('hidden');
            initGame();
            draw();
            gameRunning = true;
            gameSpeed = 120;
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(gameTick, gameSpeed);
        }

        // =========================================================
        // GAME OVER
        // =========================================================
        function gameOver() {
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }

            // Show overlay
            const overlay = document.getElementById('overlay');
            document.getElementById('overlayTitle').textContent = '💀 ' + (getCurrentLanguage() === 'ar' ? 'انتهت اللعبة!' : 'Game Over!');
            document.getElementById('overlayText').textContent = (getCurrentLanguage() === 'ar' ? 'نتيجتك: ' : 'Your score: ') + score;
            document.getElementById('overlayBtn').textContent = getCurrentLanguage() === 'ar' ? 'العب مرة أخرى' : 'Play Again';
            overlay.classList.remove('hidden');
        }

        // =========================================================
        // DIRECTION CONTROLS
        // =========================================================
        function changeDirection(dir) {
            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            if (opposites[dir] !== direction) {
                nextDirection = dir;
            }
        }

        document.addEventListener('keydown', function(e) {
            if (!gameRunning) return;
            
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDirection('right');
                    break;
            }
        });

        // =========================================================
        // INITIALIZE
        // =========================================================
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getCurrentLanguage();
            setLanguage(lang);
            applyTranslations();
            loadUserProfile();
            
            document.getElementById('highScore').textContent = highScore;
            initGame();
            draw();
        });
    </script>
</body>
</html>
