
<!DOCTYPE html>

<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ad Center • SocialWiki</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.ad-container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.top-bar h1 {
    font-size: 28px;
}

.back-btn {
    text-decoration: none;
    color: #333;
    font-weight: 600;
}

.back-btn:hover {
    color: #1877f2;
}

.create-btn {
    background: #1877f2;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.create-btn:hover {
    opacity: 0.9;
}


/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 30px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
}

.stat-card span {
    display: block;
    color: #777;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-card strong {
    font-size: 25px;
}


/* =========================================================
   MY ADS
========================================================= */

.section {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
}

.section h2 {
    margin-bottom: 20px;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty h3 {
    color: #333;
    margin-bottom: 8px;
}


/* =========================================================
   ADS LIST
========================================================= */

.ads-list {
    display: grid;
    gap: 18px;
}

.ad-card {
    border: 1px solid #e2e2e2;
    border-radius: 12px;
    padding: 20px;
    background: #fff;
}

.ad-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 14px;
}

.ad-card h3 {
    font-size: 19px;
    margin-bottom: 5px;
}

.ad-name {
    color: #777;
    font-size: 13px;
}


/* =========================================================
   AD IMAGE
========================================================= */

.ad-card-image {
    width: 100%;
    max-height: 360px;
    object-fit: cover;
    display: block;
    border-radius: 10px;
    margin-bottom: 16px;
    border: 1px solid #e2e2e2;
}

.ad-image-label {
    display: inline-block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #777;
}


/* =========================================================
   STATUS
========================================================= */

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
}

.status-draft {
    background: #eeeeee;
    color: #555;
}

.status-scheduled {
    background: #fff4d6;
    color: #946200;
}

.status-active {
    background: #e2f7e9;
    color: #16803c;
}

.status-finished {
    background: #f1e1e1;
    color: #8a3030;
}

.status-paused {
    background: #fff3cd;
    color: #856404;
}


/* =========================================================
   AD CONTENT
========================================================= */

.ad-description {
    color: #555;
    line-height: 1.5;
    margin-bottom: 16px;
}

.ad-info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.ad-info {
    background: #f7f8fa;
    border-radius: 8px;
    padding: 12px;
}

.ad-info span {
    display: block;
    color: #777;
    font-size: 12px;
    margin-bottom: 5px;
}

.ad-info strong {
    font-size: 14px;
}

.ad-link {
    display: inline-block;
    margin-top: 15px;
    color: #1877f2;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    word-break: break-all;
}

.ad-link:hover {
    text-decoration: underline;
}


/* =========================================================
   LOADING / ERROR
========================================================= */

.loading {
    text-align: center;
    padding: 40px 20px;
    color: #777;
}

.error-message {
    text-align: center;
    padding: 30px 20px;
    color: #b00020;
}


/* =========================================================
   CREATE AD MODAL
========================================================= */

.modal-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.55);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 9999;
}

.modal-overlay.show {
    display: flex;
}

.ad-modal {
    width: 100%;
    max-width: 600px;

    background: white;

    border-radius: 14px;

    padding: 25px;

    box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.25);

    max-height: 90vh;

    overflow-y: auto;
}


/* =========================================================
   MODAL HEADER
========================================================= */

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.modal-header h2 {
    font-size: 22px;
}

.close-btn {
    border: none;
    background: transparent;
    font-size: 28px;
    cursor: pointer;
    color: #555;
}

.close-btn:hover {
    color: #000;
}


/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 11px 12px;

    border: 1px solid #d5d5d5;
    border-radius: 8px;

    font-size: 14px;
    outline: none;

    background: white;

    font-family: Arial, sans-serif;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #1877f2;

    box-shadow:
        0 0 0 2px rgba(24, 119, 242, 0.08);
}

.form-group textarea {
    min-height: 100px;
    resize: vertical;
}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

#adImagePreview {
    display: none;
    margin-top: 12px;
}

#adImagePreviewImg {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid #ddd;
    display: block;
}


/* =========================================================
   ESTIMATED REACH
========================================================= */

.reach-box {
    background: #f5f8ff;

    border: 1px solid #dbe7ff;

    border-radius: 10px;

    padding: 16px;

    margin-top: 5px;

    margin-bottom: 18px;
}

.reach-title {
    font-weight: 600;
    margin-bottom: 8px;
}

#estimatedReach {
    display: block;

    font-size: 21px;

    margin-bottom: 6px;

    color: #1877f2;
}

.reach-box p {
    font-size: 12px;
    color: #777;
}


/* =========================================================
   DATES
========================================================= */

.date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}


/* =========================================================
   ACTIONS
========================================================= */

.modal-actions {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 25px;
}

.cancel-btn,
.submit-btn {
    border: none;

    padding: 11px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 600;
}

.cancel-btn {
    background: #e9e9e9;
    color: #333;
}

.submit-btn {
    background: #1877f2;
    color: white;
}

.cancel-btn:hover,
.submit-btn:hover {
    opacity: 0.9;
}

.submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .ad-info-grid {
        grid-template-columns: 1fr 1fr;
    }

}

@media (max-width: 600px) {

    .top-bar {
        flex-wrap: wrap;
    }

    .top-bar h1 {
        order: -1;
        width: 100%;
    }

    .date-row {
        grid-template-columns: 1fr;
    }

    .ad-info-grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 500px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .ad-container {
        margin: 20px auto;
    }

    .ad-modal {
        padding: 20px;
    }

    .modal-actions {
        flex-direction: column;
    }

    .cancel-btn,
    .submit-btn {
        width: 100%;
    }

    .ad-card-top {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<div class="ad-container">


<!-- =========================================================
     TOP BAR

<div class="top-bar">

    >

    <h1>

    </h1>

</div>


<!-- =========================================================

<div class="stats">

    <div class="stat-card">

        </span>

        <strong id="totalAds">
            0
        </strong>

    <div class="stat-card">

        <span>
            Active Ads
        </span>

        <strong id="activeAds">

        </strong>

    </div>


    <div class="stat-card">

        <span>
            Total Reach
        </span>

        <strong id="totalReach">
            0
        </strong>

    </div>


    <div class="stat-card">

        <span>
            Total Clicks
        </span>

        <strong id="totalClicks">
            0
        </strong>

    </div>

</div>


<!-- =========================================================
     MY ADS
========================================================= -->

<div class="section">

    <h2>
        My Ads
    </h2>


    <div

        class="ads-list"
    ></div>


    <div

        <div class="empty-icon">

        </div>

        <h3>

        </h3>

        <p>
            Create your first advertisement

        </p>

    <div
        class="loading"

    </div>

</div>

<!-- =========================================================
     CREATE AD MODAL
========================================================= -->

<div

    id="createAdModal"
>

    <div class="ad-modal">


        <div class="modal-header">

            <h2>
                Create Ad
            </h2>


            <button
                class="close-btn"
                id="closeAdModal"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="createAdForm">


            <div class="form-group">

                <label for="adName">
                    Ad Name
                </label>

                <input
                    type="text"
                    id="adName"
                    placeholder="Example: Summer Campaign"
                    required
                >

            </div>


            <div class="form-group">

                <label for="adLanguage">
                    Ad Language
                </label>

                <select
                    id="adLanguage"
                    required
                >

                    <option value="">
                        Select language
                    </option>

                    <option value="en">
                        English
                    </option>

                    <option value="fr">
                        Français
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="adCurrency">

                </label>

                <select
                    id="adCurrency"

                >

                    <option value="MAD">

                </select>

            </div>


            <div class="form-group">

                <label for="adBudget">

                </label>

                <input
                    type="number"

            </div>


            <div
                class="reach-box"

                <div class="reach-title">
                    👥 Estimated Reach
                </div>

                <strong id="estimatedReach">
                    0 - 0 people

                <p>
                    This is an estimated reach
                    and not a guaranteed result.

            <!-- =================================================

            ================================================= -->

            <div class="form-group">

<script>


// =========================================================
// SUPABASE
// =========================================================

const SUPABASE_URL =
    "https://hvslktufqrgdgrgxmvcm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_fm8uX1P8x0QyQEIb7VTDDA_27nNJBeT";

const adSupabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

console.log("📢 AD CENTER LOADED");


// =========================================================
// STORAGE
// =========================================================

const AD_MEDIA_BUCKET =
    "post_media";


// =========================================================
// ELEMENTS
// =========================================================

const createAdBtn =
    document.getElementById("createAdBtn");

const createAdModal =
    document.getElementById("createAdModal");

const closeAdModal =
    document.getElementById("closeAdModal");

const cancelAdBtn =
    document.getElementById("cancelAdBtn");

const createAdForm =
    document.getElementById("createAdForm");

const adBudget =
    document.getElementById("adBudget");

const adCurrency =
    document.getElementById("adCurrency");

const estimatedReach =
    document.getElementById("estimatedReach");

const adStartDate =
    document.getElementById("adStartDate");

const adEndDate =
    document.getElementById("adEndDate");

const submitAdBtn =
    document.getElementById("submitAdBtn");

const adsList =
    document.getElementById("adsList");

const emptyAds =
    document.getElementById("emptyAds");

const loadingAds =
    document.getElementById("loadingAds");

const totalAds =
    document.getElementById("totalAds");

const activeAds =
    document.getElementById("activeAds");

const totalReach =
    document.getElementById("totalReach");

const totalClicks =
    document.getElementById("totalClicks");

const adImage =
    document.getElementById("adImage");

const adImagePreview =
    document.getElementById("adImagePreview");

const adImagePreviewImg =
    document.getElementById("adImagePreviewImg");


// =========================================================
// IMAGE PREVIEW
// =========================================================

adImage.addEventListener(
    "change",
    function () {

        const file =
            adImage.files &&
            adImage.files[0];

        if (!file) {

            adImagePreview.style.display =
                "none";

            adImagePreviewImg.src =
                "";

            return;

        }


        if (
            !file.type.startsWith("image/")
        ) {

            alert(
                "Please select an image file."
            );

            adImage.value =
                "";

            adImagePreview.style.display =
                "none";

            adImagePreviewImg.src =
                "";

            return;

        }


        const previewUrl =
            URL.createObjectURL(file);


        adImagePreviewImg.src =
            previewUrl;

        adImagePreview.style.display =
            "block";

    }
);


// =========================================================
// OPEN MODAL
// =========================================================

createAdBtn.addEventListener(
    "click",
    function () {

        createAdModal.classList.add("show");

    }
);


// =========================================================
// CLOSE MODAL
// =========================================================

function closeCreateAdModal() {

    createAdModal.classList.remove("show");

}


closeAdModal.addEventListener(
    "click",
    closeCreateAdModal
);


cancelAdBtn.addEventListener(
    "click",
    closeCreateAdModal
);


// =========================================================
// CLICK OUTSIDE MODAL
// =========================================================

createAdModal.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            createAdModal
        ) {

            closeCreateAdModal();

        }

    }
);


// =========================================================
// ESTIMATED REACH
// =========================================================

function updateEstimatedReach() {

    const budget =
        Number(adBudget.value) || 0;

    const currency =
        adCurrency.value;

    let madBudget =
        budget;


    /*
        Internal estimate only.

        1 USD ≈ 10 MAD
        1 EUR ≈ 11 MAD
    */

    if (currency === "USD") {

        madBudget =
            budget * 10;

    }


    if (currency === "EUR") {

        madBudget =
            budget * 11;

    }


    if (madBudget <= 0) {

        estimatedReach.textContent =
            "0 - 0 people";

        return;

    }


    const minReach =
        Math.round(
            madBudget * 40
        );

    const maxReach =
        Math.round(
            madBudget * 134
        );


    estimatedReach.textContent =
        minReach.toLocaleString()
        + " - "
        + maxReach.toLocaleString()
        + " people";

}


adBudget.addEventListener(
    "input",
    updateEstimatedReach
);


adCurrency.addEventListener(
    "change",
    updateEstimatedReach
);


// =========================================================
// DATES
// =========================================================

adStartDate.addEventListener(
    "change",
    function () {

        if (adStartDate.value) {

            adEndDate.min =
                adStartDate.value;

        }


        if (
            adEndDate.value &&
            adEndDate.value <
            adStartDate.value
        ) {

            adEndDate.value =
                "";

        }

    }
);


// =========================================================
// GET AD STATUS
// =========================================================

function getAdStatus(ad) {

    /*
        IMPORTANT:
        Paused must remain Paused.
    */

    if (ad.status === "paused") {

        return {
            key: "paused",
            label: "Paused"
        };

    }


    if (ad.status === "draft") {

        return {
            key: "draft",
            label: "Draft"
        };

    }


    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    if (
        ad.start_date &&
        today < ad.start_date
    ) {

        return {
            key: "scheduled",
            label: "Scheduled"
        };

    }


    if (
        ad.end_date &&
        today > ad.end_date
    ) {

        return {
            key: "finished",
            label: "Finished"
        };

    }


    if (ad.status === "active") {

        return {
            key: "active",
            label: "Active"
        };

    }


    return {
        key: "draft",
        label: "Draft"
    };

}


// =========================================================
// FORMAT LANGUAGE
// =========================================================

function getLanguageName(language) {

    if (language === "en") {
        return "English";
    }

    if (language === "fr") {
        return "Français";
    }

    if (language === "ar") {
        return "العربية";
    }

    return language || "-";

}


// =========================================================
// FORMAT NUMBER
// =========================================================

function formatNumber(number) {

    return Number(
        number || 0
    ).toLocaleString();

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =========================================================
// UPLOAD AD IMAGE
// =========================================================

async function uploadAdImage(
    file,
    userId
) {

    if (!file) {

        return {
            mediaUrl: null,
            mediaType: null
        };

    }


    if (
        !file.type.startsWith("image/")
    ) {

        throw new Error(
            "Only image files are allowed."
        );

    }


    const fileExtension =
        file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "jpg";


    const safeExtension =
        fileExtension
            .replace(
                /[^a-z0-9]/g,
                ""
            ) || "jpg";


    const filePath =
        userId
        + "/"
        + Date.now()
        + "_ad."
        + safeExtension;


    console.log(
        "📤 Uploading ad image:",
        filePath
    );


    const {
        error: uploadError
    } =
        await adSupabase.storage
            .from(AD_MEDIA_BUCKET)
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false,
                    contentType: file.type
                }
            );


    if (uploadError) {

        console.error(
            "❌ Ad image upload error:",
            uploadError
        );

        throw uploadError;

    }


    const {
        data: publicUrlData
    } =
        adSupabase.storage
            .from(AD_MEDIA_BUCKET)
            .getPublicUrl(
                filePath
            );


    if (
        !publicUrlData ||
        !publicUrlData.publicUrl
    ) {

        throw new Error(
            "Could not generate public image URL."
        );

    }


    console.log(
        "✅ Ad image uploaded:",
        publicUrlData.publicUrl
    );


    return {
        mediaUrl:
            publicUrlData.publicUrl,

        mediaType:
            "image"
    };

}


// =========================================================
// LOAD MY ADS
// =========================================================

async function loadMyAds() {

    console.log(
        "📢 Loading my ads..."
    );


    loadingAds.style.display =
        "block";

    adsList.innerHTML =
        "";

    emptyAds.style.display =
        "none";


    try {

        // =====================================================
        // GET CURRENT USER
        // =====================================================

        const {
            data: {
                user
            },
            error: userError
        } =
            await adSupabase.auth.getUser();


        if (userError) {

            console.error(
                "❌ Get user error:",
                userError
            );

            loadingAds.style.display =
                "none";

            adsList.innerHTML =
                `
                <div class="error-message">
                    Could not get your account.
                </div>
                `;

            return;

        }


        if (!user) {

            loadingAds.style.display =
                "none";

            adsList.innerHTML =
                `
                <div class="error-message">
                    Please log in first.
                </div>
                `;

            return;

        }


        console.log(
            "👤 Current user:",
            user.id
        );


        // =====================================================
        // GET USER ADS
        // =====================================================

        const {
            data: ads,
            error
        } =
            await adSupabase
                .from("ad_campaigns")
                .select("*")
                .eq(
                    "user_id",
                    user.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(
                "❌ Load ads error:",
                error
            );

            loadingAds.style.display =
                "none";

            adsList.innerHTML =
                `
                <div class="error-message">
                    Could not load your ads.
                    Check the browser console.
                </div>
                `;

            return;

        }


        // =====================================================
        // UPDATE STATS
        // =====================================================

        totalAds.textContent =
            ads.length;


        let activeCount =
            0;

        let reachTotal =
            0;


        ads.forEach(
            function (ad) {

                const status =
                    getAdStatus(ad);


                if (
                    status.key ===
                    "active"
                ) {

                    activeCount++;

                }


                reachTotal +=
                    Number(
                        ad.estimated_reach_max || 0
                    );

            }
        );


        activeAds.textContent =
            activeCount;


        totalReach.textContent =
            formatNumber(
                reachTotal
            );


        totalClicks.textContent =
            "0";


        // =====================================================
        // NO ADS
        // =====================================================

        if (
            ads.length === 0
        ) {

            loadingAds.style.display =
                "none";

            emptyAds.style.display =
                "block";

            return;

        }


        // =====================================================
        // DISPLAY ADS
        // =====================================================

        adsList.innerHTML =
            "";


        ads.forEach(
            function (ad) {

                const status =
                    getAdStatus(ad);


                const budget =
                    formatNumber(
                        ad.budget
                    );


                const reachMin =
                    formatNumber(
                        ad.estimated_reach_min
                    );


                const reachMax =
                    formatNumber(
                        ad.estimated_reach_max
                    );


                const language =
                    getLanguageName(
                        ad.language
                    );


                const destinationLink =
                    ad.destination_link || "";


                let linkHTML =
                    "";


                if (
                    destinationLink
                ) {

                    linkHTML =
                        `
                        <a
                            class="ad-link"
                            href="${escapeHTML(destinationLink)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🔗 Open Destination
                        </a>
                        `;

                }


                // =================================================
                // IMAGE HTML
                // =================================================

                let imageHTML =
                    "";


                if (
                    ad.media_url &&
                    ad.media_type === "image"
                ) {

                    imageHTML =
                        `
                        <div>

                            <span class="ad-image-label">
                                Ad Image
                            </span>

                            <img
                                class="ad-card-image"
                                src="${escapeHTML(ad.media_url)}"
                                alt="${escapeHTML(
                                    ad.ad_title ||
                                    "Advertisement"
                                )}"
                                loading="lazy"
                            >

                        </div>
                        `;

                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "ad-card";


                card.innerHTML =
                    `
                    <div class="ad-card-top">

                        <div>

                            <h3>
                                ${escapeHTML(
                                    ad.ad_title ||
                                    "Untitled Ad"
                                )}
                            </h3>

                            <div class="ad-name">
                                ${escapeHTML(
                                    ad.ad_name ||
                                    "Unnamed Campaign"
                                )}
                            </div>

                        </div>


                        <span
                            class="status status-${status.key}"
                        >
                            ${escapeHTML(
                                status.label
                            )}
                        </span>

                    </div>


                    ${imageHTML}


                    <div class="ad-description">
                        ${escapeHTML(
                            ad.description || ""
                        )}
                    </div>


                    <div class="ad-info-grid">


                        <div class="ad-info">

                            <span>
                                Budget
                            </span>

                            <strong>
                                ${budget}
                                ${escapeHTML(
                                    ad.currency || ""
                                )}
                            </strong>

                        </div>


                        <div class="ad-info">

                            <span>
                                Language
                            </span>

                            <strong>
                                ${escapeHTML(
                                    language
                                )}
                            </strong>

                        </div>


                        <div class="ad-info">

                            <span>
                                Estimated Reach
                            </span>

                            <strong>
                                ${reachMin}
                                -
                                ${reachMax}
                            </strong>

                        </div>


                        <div class="ad-info">

                            <span>
                                Start Date
                            </span>

                            <strong>
                                ${escapeHTML(
                                    ad.start_date || "-"
                                )}
                            </strong>

                        </div>


                        <div class="ad-info">

                            <span>
                                End Date
                            </span>

                            <strong>
                                ${escapeHTML(
                                    ad.end_date || "-"
                                )}
                            </strong>

                        </div>


                        <div class="ad-info">

                            <span>
                                Campaign Status
                            </span>

                            <strong>
                                ${escapeHTML(
                                    status.label
                                )}
                            </strong>

                        </div>


                    </div>


                    ${linkHTML}
                    `;


                adsList.appendChild(
                    card
                );

            }
        );


        loadingAds.style.display =
            "none";


    }

    catch (error) {

        console.error(
            "❌ Unexpected load ads error:",
            error
        );


        loadingAds.style.display =
            "none";


        adsList.innerHTML =
            `
            <div class="error-message">
                Something went wrong while loading your ads.
            </div>
            `;

    }

}


// =========================================================
// CREATE AD
// =========================================================

createAdForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        // =====================================================
        // CHECK DATES
        // =====================================================

        const startDate =
            adStartDate.value;

        const endDate =
            adEndDate.value;


        if (
            startDate &&
            endDate &&
            endDate < startDate
        ) {

            alert(
                "End Date cannot be before Start Date."
            );

            return;

        }


        // =====================================================
        // GET FORM VALUES
        // =====================================================

        const adName =
            document
                .getElementById("adName")
                .value
                .trim();


        const adLanguage =
            document
                .getElementById("adLanguage")
                .value;


        const currency =
            adCurrency.value;


        const budget =
            Number(
                adBudget.value
            );


        const adTitle =
            document
                .getElementById("adTitle")
                .value
                .trim();


        const description =
            document
                .getElementById("adDescription")
                .value
                .trim();


        const destinationLink =
            document
                .getElementById("adLink")
                .value
                .trim();


        const imageFile =
            adImage.files &&
            adImage.files[0]
                ? adImage.files[0]
                : null;


        // =====================================================
        // VALIDATE IMAGE
        // =====================================================

        if (imageFile) {

            if (
                !imageFile.type.startsWith("image/")
            ) {

                alert(
                    "Please select a valid image."
                );

                return;

            }


            /*
                Maximum size:
                10 MB
            */

            const maxImageSize =
                10 * 1024 * 1024;


            if (
                imageFile.size >
                maxImageSize
            ) {

                alert(
                    "Image is too large. Maximum size is 10 MB."
                );

                return;

            }

        }


        // =====================================================
        // VALIDATE BUDGET
        // =====================================================

        if (
            !Number.isFinite(budget) ||
            budget <= 0
        ) {

            alert(
                "Please enter a valid budget."
            );

            return;

        }


        // =====================================================
        // DISABLE BUTTON
        // =====================================================

        submitAdBtn.disabled =
            true;

        submitAdBtn.textContent =
            "Creating...";


        try {

            // =================================================
            // GET CURRENT USER
            // =================================================

            const {
                data: {
                    user
                },
                error: userError
            } =
                await adSupabase.auth.getUser();


            if (userError) {

                console.error(
                    "❌ User error:",
                    userError
                );

                alert(
                    "Could not get current user."
                );

                return;

            }


            if (!user) {

                alert(
                    "Please log in first."
                );

                return;

            }


            // =================================================
            // CALCULATE REACH
            // =================================================

            let madBudget =
                budget;


            if (
                currency ===
                "USD"
            ) {

                madBudget =
                    budget * 10;

            }


            if (
                currency ===
                "EUR"
            ) {

                madBudget =
                    budget * 11;

            }


            const estimatedReachMin =
                Math.round(
                    madBudget * 40
                );


            const estimatedReachMax =
                Math.round(
                    madBudget * 134
                );


            // =================================================
            // UPLOAD IMAGE
            // =================================================

            let mediaUrl =
                null;

            let mediaType =
                null;


            if (imageFile) {

                console.log(
                    "📸 Ad image selected. Starting upload..."
                );


                const uploadResult =
                    await uploadAdImage(
                        imageFile,
                        user.id
                    );


                mediaUrl =
                    uploadResult.mediaUrl;


                mediaType =
                    uploadResult.mediaType;


                console.log(
                    "✅ Media ready:",
                    {
                        mediaUrl,
                        mediaType
                    }
                );

            }


            // =================================================
            // INSERT AD
            // =================================================

            const {
                data,
                error
            } =
                await adSupabase
                    .from("ad_campaigns")
                    .insert([
                        {

                            user_id:
                                user.id,

                            ad_name:
                                adName,

                            language:
                                adLanguage,

                            currency:
                                currency,

                            budget:
                                budget,

                            estimated_reach_min:
                                estimatedReachMin,

                            estimated_reach_max:
                                estimatedReachMax,

                            ad_title:
                                adTitle,

                            description:
                                description,

                            destination_link:
                                destinationLink ||
                                null,

                            start_date:
                                startDate,

                            end_date:
                                endDate,

                            media_url:
                                mediaUrl,

                            media_type:
                                mediaType,

                            status:
                                "draft"

                        }
                    ])
                    .select();


            // =================================================
            // CHECK ERROR
            // =================================================

            if (error) {

                console.error(
                    "❌ Create Ad error:",
                    error
                );

                /*
                    If the database insert fails after
                    uploading the image, the image remains
                    in Storage. This does not affect the
                    database record.
                */

                alert(
                    "Could not create the ad. Check the console."
                );

                return;

            }


            console.log(
                "✅ Ad created successfully:",
                data
            );


            // =================================================
            // SUCCESS
            // =================================================

            alert(
                "✅ Ad created successfully!"
            );


            createAdForm.reset();


            estimatedReach.textContent =
                "0 - 0 people";


            adEndDate.min =
                "";


            adImagePreview.style.display =
                "none";

            adImagePreviewImg.src =
                "";


            closeCreateAdModal();


            // =================================================
            // RELOAD
            // =================================================

            await loadMyAds();

        }


        catch (error) {

            console.error(
                "❌ Unexpected create ad error:",
                error
            );


            alert(
                "Something went wrong while creating the ad. Check the browser console."
            );

        }


        finally {

            submitAdBtn.disabled =
                false;

            submitAdBtn.textContent =
                "Create Ad";

        }

    }
);


// =========================================================
// INITIAL LOAD
// =========================================================

loadMyAds();

</script>
